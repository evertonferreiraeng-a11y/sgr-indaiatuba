<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#006636" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SGR Indaiatuba" />
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="img/icons/icon-192.png" />
  <title>Ocorrências — SGR Indaiatuba</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .main-content { overflow-x:clip; }
    .co-breadcrumb { display:flex; align-items:center; gap:6px; font-size:13px; color:#64748b; margin-bottom:14px; }
    .co-breadcrumb a { color:#006636; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:4px; padding:4px 10px 4px 6px; border-radius:999px; }
    .co-breadcrumb a:hover { background:#ecfdf3; }

    /* Ficha do colaborador */
    .co-ficha { position:relative; overflow:hidden; display:flex; align-items:center; gap:18px; flex-wrap:wrap; color:#fff;
      background:linear-gradient(135deg,#003d20 0%,#005a30 55%,#007a40 100%); border-radius:18px; padding:20px 24px; margin-bottom:16px; box-shadow:0 10px 26px rgba(0,77,40,.18); }
    .co-ficha::after { content:"♻"; position:absolute; right:-14px; bottom:-44px; font-size:160px; line-height:1; color:rgba(255,255,255,.05); pointer-events:none; }
    .co-ficha > * { position:relative; z-index:1; }
    .co-avatar { width:64px; height:64px; border-radius:18px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; letter-spacing:.02em; flex-shrink:0; }
    .co-id { min-width:0; flex:1; }
    .co-id h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em; color:#fff; }
    .co-id .co-cargo { margin:2px 0 8px; font-size:13px; color:#bbf7d0; font-weight:500; }
    .co-tags { display:flex; gap:6px; flex-wrap:wrap; }
    .co-tag { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.14); color:#ecfdf5; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
    .co-tag.verde { background:#dcfce7; color:#166534; } .co-tag.amarelo { background:#fef3c7; color:#92400e; } .co-tag.vermelho { background:#fee2e2; color:#991b1b; } .co-tag.azul { background:#dbeafe; color:#1e40af; }
    .co-resumo { display:flex; gap:22px; }
    .co-resumo div span { display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#a7f3d0; }
    .co-resumo div b { font-size:24px; font-weight:800; line-height:1.15; color:#fff; }
    .co-resumo div small { font-size:12px; font-weight:600; color:#d1fae5; }
    .co-ficha .btn-primary { background:#fff; color:#064e3b; border-color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.15); }
    .co-ficha .btn-primary:hover { background:#ecfdf5; }

    /* Contadores */
    .co-kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
    @media(max-width:900px) { .co-kpis { grid-template-columns:repeat(2,1fr); } }
    .co-kpi { --c:#64748b; --bg:#f1f5f9; position:relative; overflow:hidden; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px 14px 12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:transform .15s, box-shadow .15s; text-align:left; font:inherit; color:inherit; }
    .co-kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
    .co-kpi:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(15,23,42,.08); }
    .co-kpi.on { border-color:var(--c); box-shadow:0 0 0 2px var(--bg); }
    .co-kpi-ic { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--bg); color:var(--c); flex:none; font-weight:800; }
    .co-kpi .val { font-size:24px; font-weight:800; line-height:1; color:var(--c); }
    .co-kpi .lbl { font-size:11.5px; color:#64748b; margin-top:3px; font-weight:600; }

    /* Filtros */
    .co-filters { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px 16px; margin-bottom:16px; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
    .co-filters .form-group { min-width:150px; }
    .co-quick { display:flex; gap:6px; flex-wrap:wrap; }
    .co-quick button { padding:7px 14px; border:1px solid #e2e8f0; border-radius:999px; background:#fff; color:#475569; font-size:12.5px; font-weight:600; cursor:pointer; }
    .co-quick button:hover { border-color:#94a3b8; }
    .co-quick button.active { background:#006636; border-color:#006636; color:#fff; }

    .co-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; align-items:start; }
    @media(max-width:1100px) { .co-grid { grid-template-columns:1fr; } }
    .co-col { display:flex; flex-direction:column; gap:16px; min-width:0; }

    .co-card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.03); }
    .co-card-hd { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .co-card-hd h3 { font-size:15px; font-weight:800; color:#0f172a; margin:0; display:flex; align-items:center; gap:10px; }
    .co-card-hd h3 .ic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:#ecfdf3; color:#15803d; }
    .co-card-hd .meta { font-size:12.5px; color:#94a3b8; font-weight:600; }

    /* Calendário */
    .cal-nav { display:flex; align-items:center; gap:6px; }
    .cal-nav button { border:1px solid #e2e8f0; background:#fff; border-radius:9px; width:32px; height:32px; cursor:pointer; font-size:16px; color:#334155; }
    .cal-nav button:hover { background:#f1f5f9; }
    .cal-nav-titulo { font-size:14px; font-weight:800; color:#0f172a; min-width:150px; text-align:center; }
    .cal-weekdays, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .cal-weekdays div { text-align:center; font-size:11px; font-weight:700; color:#94a3b8; padding-bottom:2px; }
    .cal-day { --c:#0f172a; min-height:62px; border:1px solid #eef2f6; background:#fff; border-radius:10px; padding:6px 7px; cursor:pointer; transition:transform .12s, box-shadow .12s; display:flex; flex-direction:column; justify-content:space-between; gap:4px; }
    .cal-day:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(15,23,42,.08); }
    .cal-day.fds { background:#f8fafc; }
    .cal-day.futuro .cal-daynum { color:#cbd5e1; }
    .cal-day-empty { border:none; background:none; cursor:default; }
    .cal-day-empty:hover { transform:none; box-shadow:none; }
    .cal-daynum { font-size:12px; font-weight:800; color:#64748b; }
    .cal-day.hoje { box-shadow:0 0 0 2px #006636; }
    .cal-day.t-outro { background:#f0fdf4; border-color:#bbf7d0; } .cal-day.t-outro .cal-daynum { color:#15803d; }
    .cal-day.t-falta { background:#fef2f2; border-color:#fecaca; } .cal-day.t-falta .cal-daynum { color:#b91c1c; }
    .cal-day.t-atestado { background:#fffbeb; border-color:#fde68a; } .cal-day.t-atestado .cal-daynum { color:#b45309; }
    .cal-day.t-advertencia { background:#fff1f2; border-color:#fda4af; } .cal-day.t-advertencia .cal-daynum { color:#9f1239; }
    .cal-day.t-falta_declaracao { background:#fff7ed; border-color:#fdba74; } .cal-day.t-falta_declaracao .cal-daynum { color:#9a3412; }
    .cal-day.t-atraso { background:#fefce8; border-color:#fde047; } .cal-day.t-atraso .cal-daynum { color:#854d0e; }
    .cal-day.t-feriado { background:#fefce8; border-color:#facc15; border-style:dashed; } .cal-day.t-feriado .cal-daynum { color:#a16207; }
    .cal-day.t-ferias { background:#f0f9ff; border-color:#7dd3fc; } .cal-day.t-ferias .cal-daynum { color:#075985; }
    .cal-day.t-declaracao { background:#f5f3ff; border-color:#c4b5fd; } .cal-day.t-declaracao .cal-daynum { color:#5b21b6; }
    .cal-day.t-elogio { background:#f1f5f9; border-color:#e2e8f0; }
    .cal-tipo { font-size:10.5px; font-weight:700; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:4px; }
    .cal-tipo i { width:6px; height:6px; border-radius:50%; flex:none; }
    .cal-mot { display:block; font-size:10px; font-weight:600; color:#64748b; margin:1px 0 0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cal-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid #f1f5f9; }
    .cal-legend span { display:flex; align-items:center; gap:6px; font-size:12px; color:#64748b; font-weight:600; }
    .cal-legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }

    /* Observações */
    .obs-area { width:100%; min-height:130px; resize:vertical; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; font:inherit; font-size:14px; line-height:1.55; color:#0f172a; background:#fcfdfc; }
    .obs-area:focus { outline:none; border-color:#16a34a; box-shadow:0 0 0 3px #dcfce7; background:#fff; }
    .obs-area[readonly] { background:#f8fafc; color:#334155; }
    .obs-rodape { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap; }
    .obs-status { font-size:12px; color:#94a3b8; }
    .obs-status.sujo { color:#b45309; font-weight:600; }
    .obs-aviso { font-size:12.5px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px 12px; }

    /* Histórico em linha do tempo */
    .hist-mes { font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#94a3b8; margin:14px 0 6px; display:flex; justify-content:space-between; }
    .hist-mes:first-child { margin-top:0; }
    .hist-lista { max-height:640px; overflow:auto; padding-right:4px; }
    .hist-row { position:relative; display:flex; align-items:center; gap:12px; padding:8px 8px 8px 26px; border-radius:10px; font-size:13px; }
    .hist-row::before { content:""; position:absolute; left:10px; top:0; bottom:0; width:2px; background:#eef2f6; }
    .hist-row::after { content:""; position:absolute; left:6px; top:50%; width:10px; height:10px; margin-top:-5px; border-radius:50%; background:var(--c, #94a3b8); box-shadow:0 0 0 3px #fff; }
    .hist-row:hover { background:#f8fafc; }
    .hist-data { min-width:86px; color:#334155; font-weight:700; font-size:12.5px; white-space:nowrap; }
    .hist-data small { display:block; font-weight:500; color:#94a3b8; font-size:11px; }
    .hist-tipo { font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
    .hist-desc { flex:1; min-width:0; color:#475569; overflow:hidden; text-overflow:ellipsis; }
    .hist-acoes { display:flex; gap:2px; opacity:0; transition:opacity .15s; }
    .hist-row:hover .hist-acoes { opacity:1; }
    @media (hover:none) { .hist-acoes { opacity:1; } }
    .hist-empty { font-size:13px; color:#94a3b8; padding:24px 0; text-align:center; }

    .co-loading { padding:60px; text-align:center; color:#94a3b8; }

    /* Botão do histórico */
    .btn-hist { display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:14px; padding:14px 16px; transition:all .15s; }
    .btn-hist:hover { background:#ecfdf3; border-color:#16a34a; border-style:solid; }
    .btn-hist .ic { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#006636; color:#fff; flex:none; }
    .btn-hist b { display:block; font-size:14.5px; color:#0f172a; }
    .btn-hist span.sub { font-size:12.5px; color:#64748b; }
    .btn-hist .seta { margin-left:auto; font-size:20px; color:#006636; }

    /* Estatísticas */
    .st-sec { font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#94a3b8; margin:18px 0 8px; }
    .st-tiles { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
    @media(max-width:600px) { .st-tiles { grid-template-columns:repeat(2, minmax(0,1fr)); } }
    .st-tile { background:#f8fafc; border:1px solid #eef2f6; border-radius:12px; padding:10px 12px; min-width:0; }
    .st-tile span { display:block; font-size:12px; font-weight:600; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .st-tile b { display:block; font-size:20px; font-weight:800; color:#0f172a; line-height:1.2; margin-top:2px; white-space:nowrap; }
    .st-tile small { font-size:11.5px; color:#94a3b8; font-weight:500; }
    .st-tile.st-largo { grid-column:1 / -1; display:grid; grid-template-columns:minmax(150px, 0.8fr) 3fr; gap:14px; align-items:center; }
    @media(max-width:700px) { .st-tile.st-largo { grid-template-columns:1fr; } }
    .st-largo-top b { font-size:26px; }
    .st-sub { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
    @media(max-width:600px) { .st-sub { grid-template-columns:repeat(2, minmax(0,1fr)); } }
    .st-sub-item { background:rgba(255,255,255,.75); border:1px solid rgba(0,0,0,.05); border-radius:10px; padding:8px 10px; min-width:0; }
    .st-sub-item b { font-size:18px !important; color:#0f172a; }
    .st-sub-item span { white-space:normal !important; line-height:1.25; }
    .st-sub-item small { display:block; line-height:1.3; }
    .st-tile.verde { background:#f0fdf4; border-color:#bbf7d0; } .st-tile.verde b { color:#15803d; }
    .st-tile.vermelho { background:#fef2f2; border-color:#fecaca; } .st-tile.vermelho b { color:#b91c1c; }
    .st-tile.amarelo { background:#fffbeb; border-color:#fde68a; } .st-tile.amarelo b { color:#b45309; }
    .st-graf { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:10px; }
    @media(max-width:700px) { .st-graf { grid-template-columns:1fr; } }
    .st-box { background:#fff; border:1px solid #eef2f6; border-radius:12px; padding:12px 14px; min-width:0; }
    .st-box h4 { margin:0 0 10px; font-size:12.5px; font-weight:700; color:#334155; }
    .st-barras { display:flex; align-items:flex-end; gap:6px; height:110px; }
    .st-barras > div { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
    .st-pilha { width:100%; max-width:34px; display:flex; flex-direction:column-reverse; border-radius:6px 6px 2px 2px; overflow:hidden; background:#f1f5f9; min-height:3px; }
    .st-pilha i { display:block; width:100%; }
    .st-barras em { font-style:normal; font-size:11px; font-weight:800; color:#334155; line-height:1; }
    .st-barras span { font-size:10.5px; color:#94a3b8; font-weight:600; }
    .st-leg { display:flex; gap:12px; margin-top:8px; font-size:11.5px; color:#64748b; }
    .st-leg i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
    .st-dias { display:flex; flex-direction:column; gap:6px; }
    .st-dia { display:grid; grid-template-columns:34px 1fr 22px; align-items:center; gap:8px; font-size:12px; color:#475569; font-weight:600; }
    .st-dia .tr { height:10px; background:#f1f5f9; border-radius:999px; overflow:hidden; }
    .st-dia .tr i { display:block; height:100%; background:#f87171; border-radius:999px; }
    .st-dia b { text-align:right; color:#0f172a; }
    .aval-item { background:#f8fafc; border-radius:8px; padding:12px; margin-bottom:8px; }
    .aval-resumo { cursor:pointer; margin-bottom:0; transition:background .15s; }
    .aval-resumo:hover { background:#eef6f1; }
    .aval-top  { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
    .aval-nota { font-size:22px; font-weight:800; }
    .aval-criterios { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    @media(max-width:600px){ .aval-criterios{ grid-template-columns:repeat(4,1fr); } }
    .crit-pill { background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:4px 6px; text-align:center; }
    .crit-pill .cn { font-size:13px; font-weight:700; }
    .crit-pill .cl { font-size:9px; color:#94a3b8; line-height:1.2; }
    .st-aval { display:flex; flex-direction:column; gap:6px; }
    .st-aval-row { display:flex; align-items:center; gap:10px; font-size:12.5px; }
    .st-aval-row span { width:74px; color:#64748b; }
    .st-aval-row .tr { flex:1; height:8px; background:#f1f5f9; border-radius:999px; overflow:hidden; }
    .st-aval-row .tr i { display:block; height:100%; border-radius:999px; }
    .st-aval-row b { width:30px; text-align:right; }
    .st-vazio { font-size:12.5px; color:#94a3b8; padding:6px 0; }

    /* Modal do histórico */
    #modal-hist .modal { max-width:980px; width:calc(100% - 32px); }
    .mh-filtros { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
    .mh-filtros .form-group { min-width:140px; }
    .mh-resumo { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; padding:10px 12px; background:#f8fafc; border-radius:12px; }
    .mh-resumo span { font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:999px; }
    #modal-hist .hist-lista { max-height:min(60vh, 620px); }
    @media print {
      body.imprimindo-hist .app-layout, body.imprimindo-hist #modal-oc, body.imprimindo-hist .modal-header .modal-close, body.imprimindo-hist .modal-footer, body.imprimindo-hist .mh-filtros, body.imprimindo-hist .hist-acoes, body.imprimindo-hist #ajuda-btn, body.imprimindo-hist .sidebar-toggle { display:none !important; }
      body.imprimindo-hist #modal-hist { position:static !important; background:none !important; display:block !important; }
      body.imprimindo-hist #modal-hist .modal { max-width:none; width:100%; box-shadow:none; max-height:none; }
      body.imprimindo-hist #modal-hist .hist-lista { max-height:none; overflow:visible; }
      body.imprimindo-hist .modal-body { overflow:visible !important; max-height:none !important; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div class="page-body">
      <div class="co-breadcrumb">
        <a href="rh.html">← Voltar para o RH</a>
      </div>

      <div id="co-content">
        <div class="co-loading">Carregando…</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Histórico (para conferir com o cartão ponto) -->
<div class="modal-backdrop" id="modal-hist">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-hist-title">Histórico de ocorrências</h3>
      <button class="modal-close" data-close="modal-hist">✕</button>
    </div>
    <div class="modal-body">
      <div class="mh-filtros">
        <div class="form-group"><label>De</label><input type="date" id="h-ini" /></div>
        <div class="form-group"><label>Até</label><input type="date" id="h-fim" /></div>
        <div class="form-group"><label>Tipo</label>
          <select id="h-tipo">
            <option value="">Todos</option>
            <option value="@falta">Todas as faltas</option>
            <optgroup label="Falta">
              <option value="falta">Injustificada</option>
              <option value="atestado">Justificada (atestado)</option>
              <option value="falta_declaracao">Declaração de horas</option>
              <option value="ferias">Férias</option>
            </optgroup>
            <optgroup label="Presente">
              <option value="outro">Normal</option>
              <option value="atraso">Atraso</option>
              <option value="declaracao">Declaração de horas</option>
              <option value="advertencia">Advertência</option>
              <option value="elogio">Outro</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group" style="min-width:auto"><label>&nbsp;</label>
          <div class="co-quick" id="h-quick">
            <button type="button" data-q="mes">Este mês</button>
            <button type="button" data-q="mes-passado">Mês passado</button>
            <button type="button" data-q="ano">Este ano</button>
            <button type="button" data-q="tudo">Tudo</button>
          </div>
        </div>
      </div>
      <div class="mh-resumo" id="h-resumo"></div>
      <div class="hist-lista" id="hist-lista"></div>
    </div>
    <div class="modal-footer">

<div id="toast-container"></div>
<script type="module">
import { supabase, initPage, dataBR, toast, abrirModal, fecharModal } from './js/config.js?v=12';

import { montarFormOc, resetFormOc, preencherFormOc, lerFormOc, gravarOcorrencia, OC_LABEL, TIPOS_FALTA, ehFalta, rotuloOc, rotuloCal } from './js/oc-form.js?v=6';

await initPage();

const params    = new URLSearchParams(location.search);
const colabId   = params.get('id');
const contentEl = document.getElementById('co-content');

if (!colabId) {
  contentEl.innerHTML = '<div class="co-loading">Colaborador não informado.</div>';

}

const TIPO_LABEL = OC_LABEL;
const TIPO_COR   = { atraso:'background:#fef9c3;color:#854d0e', falta:'background:#fee2e2;color:#991b1b', atestado:'background:#fef3c7;color:#92400e', falta_declaracao:'background:#ffedd5;color:#9a3412', ferias:'background:#e0f2fe;color:#075985', declaracao:'background:#ede9fe;color:#5b21b6', advertencia:'background:#ffe4e6;color:#9f1239', elogio:'background:#f1f5f9;color:#475569', outro:'background:#dcfce7;color:#166534' };
const TIPO_PONTO = { atraso:'#ca8a04', falta:'#dc2626', atestado:'#d97706', falta_declaracao:'#ea580c', ferias:'#0284c7', declaracao:'#7c3aed', advertencia:'#e11d48', elogio:'#94a3b8', outro:'#16a34a' };
// No calendário, quando há mais de um registro no dia, vale o mais "grave"
const TIPO_PESO  = { falta:0, falta_declaracao:1, atestado:2, ferias:3, atraso:5, declaracao:6, elogio:7, outro:8, advertencia:9 };
const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_AB = ['dom','seg','ter','qua','qui','sex','sáb'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CRITERIOS = ['relacionamento','responsabilidade','cooperacao','conhecimento_trabalho','interesse','atitude_profissional','produtividade'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fimDoMesISO = (y, m) => { const d = new Date(y, m, 0); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

let perfil, colaborador, cargoNome = '', notaMedia = null, ocColab = [], avalsColab = [];
let calYear, calMonth; // calMonth 0-indexed
let quickAtivo = '';
let temCampoObs = true;

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  const { data: p } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  perfil = p;

  const { data: c, error } = await supabase.from('colaboradores').select('*').eq('id', colabId).single();
  if (error || !c) {
    contentEl.innerHTML = '<div class="co-loading">Colaborador não encontrado.</div>';

  }
  colaborador = c;
  temCampoObs = 'anotacoes' in c;

  // Cargo e nota média (opcionais: se falharem, a tela abre do mesmo jeito)

  else if (c.cargo_id) {

    cargoNome = cg?.nome || '';
  }
  const { data: avals } = await supabase.from('colaborador_avaliacoes').select('*').eq('colaborador_id', colabId);
  avalsColab = avals || [];
  const medias = (avals || []).map(a => { const n = CRITERIOS.map(k => parseFloat(a[k]) || 0).filter(v => v > 0); return n.length ? n.reduce((s, v) => s + v, 0) / n.length : null; }).filter(v => v !== null);

  montarLayout();

}

// Tempo de casa: "1 ano e 8 meses", "3 meses", "12 dias"
function tempoDeCasa(ini, fim) {
  if (!ini) return '';
  const a = new Date(ini + 'T00:00:00'), b = new Date((fim || hojeISO()) + 'T00:00:00');
  let meses = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) meses--;
  if (meses < 1) { const d = Math.max(0, Math.round((b - a) / 86400000)); return `${d} dia${d === 1 ? '' : 's'}`; }
  const anos = Math.floor(meses / 12), m = meses % 12;
  const pA = anos ? `${anos} ano${anos > 1 ? 's' : ''}` : '', pM = m ? `${m} ${m > 1 ? 'meses' : 'mês'}` : '';
  return [pA, pM].filter(Boolean).join(' e ');
}

function tagsSituacao(c) {
  const hoje = hojeISO(), t = [];
  if (c.demissao) t.push(['vermelho', `Desligado em ${dataBR(c.demissao)}`]);
  else {
    if (c.em_ferias) t.push(['azul', 'Em férias']);
    if (c.passou_exp_1 === false || c.passou_exp_2 === false) t.push(['vermelho', `Reprovado na ${c.passou_exp_2 === false ? '2ª' : '1ª'} experiência`]);
    else if (c.fim_experiencia_1 && hoje <= c.fim_experiencia_1) t.push(['azul', `1ª experiência até ${dataBR(c.fim_experiencia_1)}`]);
    else if (c.fim_experiencia_2 && hoje <= c.fim_experiencia_2) t.push(['amarelo', `2ª experiência até ${dataBR(c.fim_experiencia_2)}`]);
    else t.push(['verde', 'Efetivado']);
  }
  if (notaMedia !== null) t.push([notaMedia >= 7 ? 'verde' : notaMedia >= 5 ? 'amarelo' : 'vermelho', `Nota ${notaMedia.toFixed(1)}`]);
  return t.map(([cls, tx]) => `<span class="co-tag ${cls}">${tx}</span>`).join('');
}

function montarLayout() {
  const isAdm = perfil?.role === 'admin';
  const c = colaborador;
  const iniciais = c.nome.trim().split(/\s+/).filter((_, i, a) => i === 0 || i === a.length - 1).map(p => p[0]).join('').toUpperCase();
  const linhaCargo = [cargoNome, c.chapa ? `Chapa ${esc(c.chapa)}` : '', c.data_admissao ? `Admissão ${dataBR(c.data_admissao)}` : ''].filter(Boolean).join(' · ');
  contentEl.innerHTML = `
    <div class="co-ficha">
      <div class="co-avatar">${esc(iniciais)}</div>
      <div class="co-id">
        <h2>${esc(c.nome)}</h2>
        <p class="co-cargo">${esc(linhaCargo)}</p>
        <div class="co-tags">${tagsSituacao(c)}</div>
      </div>
      <div class="co-resumo">
        ${c.data_admissao ? `<div><span>Tempo de casa</span><b>${tempoDeCasa(c.data_admissao, c.demissao)}</b></div>` : ''}
        <div><span>Presença no período</span><b id="co-pres">—</b></div>
      </div>
      ${isAdm ? `<button class="btn btn-primary" id="btn-nova-oc">+ Ocorrência</button>` : ''}
    </div>


    <div class="co-filters">
      <div class="form-group"><label>De</label><input type="date" id="f-ini" /></div>
      <div class="form-group"><label>Até</label><input type="date" id="f-fim" /></div>
      <div class="form-group" style="min-width:auto">
        <label>&nbsp;</label>
        <div class="co-quick">
          <button type="button" data-q="mes">Este mês</button>
          <button type="button" data-q="mes-passado">Mês passado</button>
          <button type="button" data-q="ano">Este ano</button>
          <button type="button" data-q="tudo">Tudo</button>
        </div>
      </div>
    </div>

    <div class="co-grid">
      <div class="co-col">
        <div class="co-card">
          <div class="co-card-hd">
            <h3><span class="ic">${icon('calendar',{size:16})}</span>Calendário</h3>
            <div class="cal-nav">
              <button type="button" id="cal-prev" title="Mês anterior">‹</button>
              <span class="cal-nav-titulo" id="cal-titulo"></span>
              <button type="button" id="cal-next" title="Próximo mês">›</button>
            </div>
          </div>
          <div class="cal-weekdays">${DIAS_SEMANA.map(d => `<div>${d}</div>`).join('')}</div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-legend">
            <span style="margin-left:auto;font-weight:500">${isAdm ? 'Clique num dia para lançar ou editar' : ''}</span>
          </div>
        </div>

        <div class="co-card">
          <div class="co-card-hd">
            <h3><span class="ic">${icon('edit',{size:16})}</span>Observações sobre o colaborador</h3>
          </div>
          <div id="obs-box"></div>
        </div>
      </div>

      <div class="co-card">
        <button type="button" class="btn-hist" id="btn-abrir-hist">
          <span class="ic">${icon('list',{size:20})}</span>
          <span><b>Abrir histórico de ocorrências</b><span class="sub" id="hist-count">Para conferir com o cartão ponto, com filtro de período</span></span>
          <span class="seta">→</span>
        </button>
        <div id="co-stats"></div>
      </div>
    </div>
  `;

  document.getElementById('cal-prev').addEventListener('click', () => { moverMes(-1); });
  document.getElementById('cal-next').addEventListener('click', () => { moverMes(1); });
  document.getElementById('f-ini').addEventListener('change', () => { quickAtivo=''; marcarQuick(); renderTudoFiltrado(); });
  document.getElementById('f-fim').addEventListener('change', () => { quickAtivo=''; marcarQuick(); renderTudoFiltrado(); });
  document.querySelectorAll('.co-filters .co-quick [data-q]').forEach(b => b.addEventListener('click', () => setQuick(b.dataset.q)));
  document.getElementById('btn-abrir-hist').addEventListener('click', () => abrirHistorico());
  ['h-ini','h-fim'].forEach(id => document.getElementById(id).addEventListener('change', () => { marcarQuickH(''); renderHistorico(); }));
  document.getElementById('h-tipo').addEventListener('change', renderHistorico);
  document.querySelectorAll('#h-quick [data-q]').forEach(b => b.addEventListener('click', () => setQuickH(b.dataset.q)));
  document.getElementById('btn-imprimir-hist').addEventListener('click', () => {
    document.body.classList.add('imprimindo-hist');
    setTimeout(() => { window.print(); document.body.classList.remove('imprimindo-hist'); }, 50);
  });
  document.getElementById('btn-nova-oc')?.addEventListener('click', () => abrirNovaOc(hojeISO()));

  document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => fecharModal(btn.dataset.close)));
  document.querySelectorAll('.modal-backdrop').forEach(m => m.addEventListener('click', e => { if(e.target===m) fecharModal(m.id); }));

  montarFormOc(document.getElementById('ocf-campos'));

  document.getElementById('btn-salvar-oc').addEventListener('click', salvarOc);
  document.getElementById('btn-excluir-oc').addEventListener('click', excluirOcAtual);

  renderObservacoes();
}

// ── Observações livres ───────────────────────────────────────────────────────
function quandoSalvo() {
  const c = colaborador;
  if (!c.anotacoes_em) return c.anotacoes ? '' : 'Nenhuma observação ainda.';
  const d = new Date(c.anotacoes_em);
  const hh = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `Última edição em ${d.toLocaleDateString('pt-BR')} às ${hh}${c.anotacoes_por ? ` por ${esc(c.anotacoes_por)}` : ''}`;
}

function renderObservacoes() {
  const box = document.getElementById('obs-box'); if (!box) return;
  const isAdm = perfil?.role === 'admin';
  if (!temCampoObs) {
    box.innerHTML = `<div class="obs-aviso">O campo de observações ainda não foi criado no banco. Rode o arquivo <b>supabase-patch37.sql</b> no SQL Editor do Supabase e recarregue a página.</div>`;
    return;
  }
  box.innerHTML = `
    <textarea class="obs-area" id="obs-txt" ${isAdm ? '' : 'readonly'} placeholder="${isAdm ? 'Anote aqui o que for importante: combinados, pontos de atenção, elogios, conversas, restrições médicas…' : 'Sem observações.'}">${esc(colaborador.anotacoes || '')}</textarea>
    <div class="obs-rodape">
      <span class="obs-status" id="obs-status">${quandoSalvo()}</span>
      ${isAdm ? '<button class="btn btn-primary" id="btn-salvar-obs">Salvar observações</button>' : ''}
    </div>`;
  if (!isAdm) return;
  const txt = document.getElementById('obs-txt'), st = document.getElementById('obs-status');
  txt.addEventListener('input', () => {
    const sujo = txt.value !== (colaborador.anotacoes || '');
    st.classList.toggle('sujo', sujo);
    st.textContent = sujo ? 'Alterações não salvas' : quandoSalvo();
  });
  txt.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); salvarObservacoes(); } });
  document.getElementById('btn-salvar-obs').addEventListener('click', salvarObservacoes);
}

async function salvarObservacoes() {
  const txt = document.getElementById('obs-txt'); if (!txt) return;
  const btn = document.getElementById('btn-salvar-obs'); btn.disabled = true;
  const payload = { anotacoes: txt.value.trim() || null, anotacoes_em: new Date().toISOString(), anotacoes_por: perfil?.nome || null };
  const { error } = await supabase.from('colaboradores').update(payload).eq('id', colabId);
  btn.disabled = false;
  if (error) { toast('Erro ao salvar observações: ' + error.message, 'error'); return; }
  Object.assign(colaborador, payload);
  toast('Observações salvas!');
  const st = document.getElementById('obs-status');
  st.classList.remove('sujo'); st.textContent = quandoSalvo();
}
window.addEventListener('beforeunload', e => {
  const txt = document.getElementById('obs-txt');
  if (txt && !txt.readOnly && txt.value !== (colaborador?.anotacoes || '')) { e.preventDefault(); e.returnValue = ''; }
});

function moverMes(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendario();
}

function marcarQuick() {
  document.querySelectorAll('.co-filters .co-quick [data-q]').forEach(b => b.classList.toggle('active', b.dataset.q === quickAtivo));
}

// Período dos atalhos (Este mês, Mês passado, Este ano, Tudo)
function periodoQuick(q) {
  const hoje = new Date();
  const pad = n => String(n).padStart(2,'0');
  const fmt = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
  if (q === 'mes') return [fmt(hoje.getFullYear(), hoje.getMonth()+1, 1), fimDoMesISO(hoje.getFullYear(), hoje.getMonth()+1)];
  if (q === 'mes-passado') { const mp = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1); return [fmt(mp.getFullYear(), mp.getMonth()+1, 1), fimDoMesISO(mp.getFullYear(), mp.getMonth()+1)]; }
  if (q === 'ano') return [fmt(hoje.getFullYear(), 1, 1), fmt(hoje.getFullYear(), 12, 31)];
  return ['', ''];
}

function setQuick(q) {
  quickAtivo = q;
  marcarQuick();
  [document.getElementById('f-ini').value, document.getElementById('f-fim').value] = periodoQuick(q);
  renderTudoFiltrado();
}

// ── Tela do histórico ────────────────────────────────────────────────────────
function marcarQuickH(q) {
  document.querySelectorAll('#h-quick [data-q]').forEach(b => b.classList.toggle('active', b.dataset.q === q));
}
function setQuickH(q) {
  marcarQuickH(q);
  [document.getElementById('h-ini').value, document.getElementById('h-fim').value] = periodoQuick(q);
  renderHistorico();
}
// Abre com o mesmo período do topo da tela (e, se vier, já filtrado por um tipo)
function abrirHistorico(tipo = '') {
  document.getElementById('h-ini').value = document.getElementById('f-ini').value;
  document.getElementById('h-fim').value = document.getElementById('f-fim').value;
  document.getElementById('h-tipo').value = tipo;
  marcarQuickH(quickAtivo);
  document.getElementById('modal-hist-title').textContent = `Histórico de ocorrências · ${colaborador.nome}`;
  renderHistorico();
  abrirModal('modal-hist');
}

async function carregarOcorrencias() {
  const { data, error } = await supabase.from('ocorrencias').select('*').eq('colaborador_id', colabId).order('data', { ascending: false });
  if (error) { toast('Erro ao carregar ocorrências: ' + error.message, 'error'); return; }
  ocColab = data || [];
  renderCalendario();
  renderTudoFiltrado();
}

// ── Estatísticas do colaborador ──────────────────────────────────────────────
// Presença contada por dia: o dia é falta se tiver registro de falta; férias não conta nem como falta nem como presença;
// qualquer outro registro conta como presença
function presencaDias(lista) {
  const dias = {};
  lista.forEach(o => {
    if (ehFalta(o)) dias[o.data] = 'f';
    else if (!['ferias', 'advertencia'].includes(o.tipo) && !dias[o.data]) dias[o.data] = 'p';
  });
  const b = Object.keys(dias).length, p = Object.values(dias).filter(v => v === 'p').length;
  return { p, b, pct: b ? Math.round(p / b * 100) : null };
}
function renderEstatisticas() {
  const el = document.getElementById('co-stats'); if (!el) return;
  const hoje = hojeISO(), ano = hoje.slice(0, 4);
  const doAno = ocColab.filter(o => o.data.startsWith(ano) && o.data <= hoje);
  const n = (lista, t) => lista.filter(o => o.tipo === t).length;
  // Conta como falta: injustificada, justificada, falta com declaração e "outro" marcado como falta (férias não conta)
  const nAus = lista => lista.filter(ehFalta).length;
  const nJust = lista => lista.filter(o => o.tipo === 'atestado' || o.tipo === 'falta_declaracao').length;
  const presenca = presencaDias;
  const corPres = v => v == null ? '' : v >= 95 ? 'verde' : v >= 85 ? 'amarelo' : 'vermelho';
  const detalhe = lista => { const f = n(lista, 'falta'), j = nJust(lista), o = nAus(lista) - f - j;
    return [f && `${f} sem justif.`, j && `${j} justificada${j === 1 ? '' : 's'}`, o && `${o} outro${o === 1 ? '' : 's'}`].filter(Boolean).join(' · ') || 'nenhuma'; };
  const pAno = presenca(doAno);
  const faltasAno = nAus(doAno), advAno = n(doAno, 'advertencia');
  // Última falta (qualquer ausência) e dias desde então
  const ultFalta = ocColab.filter(o => ehFalta(o) && o.data <= hoje).map(o => o.data).sort().pop();
  const diasDesde = dt => Math.round((new Date(hoje + 'T00:00:00') - new Date(dt + 'T00:00:00')) / 86400000);
  const ref = ultFalta || colaborador.data_admissao;
  const semFaltar = ref ? diasDesde(ref) : null;
  // Média mensal de faltas desde a admissão (ou desde o 1º registro)
  const ini = colaborador.data_admissao || ocColab.map(o => o.data).sort()[0];
  const mesesCasa = ini ? Math.max(1, (new Date().getFullYear() - +ini.slice(0, 4)) * 12 + (new Date().getMonth() + 1 - +ini.slice(5, 7)) + 1) : null;
  const faltasTot = nAus(ocColab);
  const mediaMes = mesesCasa ? faltasTot / mesesCasa : null;

  const tile = (rot, val, cls = '', sub = '') => `<div class="st-tile ${cls}"><span>${rot}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  const tiles = [
    tile(`Presença em ${ano}`, pAno.pct == null ? '—' : `${pAno.pct}%`, corPres(pAno.pct), pAno.b ? `${pAno.p} de ${pAno.b} dias` : 'sem registros'),
    tile(`Faltas em ${ano}`, faltasAno, faltasAno ? 'vermelho' : 'verde', detalhe(doAno)),
    tile(`Advertências em ${ano}`, advAno, advAno ? 'vermelho' : 'verde', advAno ? '' : 'nenhuma'),
    tile(ultFalta ? 'Dias sem faltar' : 'Sem faltas desde a admissão', semFaltar == null ? '—' : `${semFaltar}`, semFaltar == null ? '' : semFaltar >= 30 ? 'verde' : semFaltar >= 7 ? 'amarelo' : 'vermelho', ultFalta ? `última falta em ${dataBR(ultFalta)}` : 'dias corridos'),
    tile('Média de faltas', mediaMes == null ? '—' : mediaMes.toFixed(1).replace('.', ','), '', 'por mês desde a admissão'),
  ].join('');

  // ── Período filtrado no topo (De / Até) ──
  const pIni = document.getElementById('f-ini').value, pFim = document.getElementById('f-fim').value;
  const doPer = ocFiltradas();
  const pad2 = v => String(v).padStart(2, '0');
  // Quando o filtro é exatamente um mês inteiro, mostra o nome do mês e compara com o mês anterior
  let mesSel = null;
  if (pIni && pFim && pIni.slice(8) === '01' && pIni.slice(0, 7) === pFim.slice(0, 7) && pFim === fimDoMesISO(+pIni.slice(0, 4), +pIni.slice(5, 7))) mesSel = pIni.slice(0, 7);
  const rotPer = mesSel ? `${MESES[+mesSel.slice(5) - 1]} de ${mesSel.slice(0, 4)}`
    : !pIni && !pFim ? 'todo o histórico'
    : pIni.slice(0, 4) === pFim.slice(0, 4) && pIni.slice(5) === '01-01' && pFim.slice(5) === '12-31' ? `Ano de ${pIni.slice(0, 4)}`
    : `${pIni ? dataBR(pIni) : 'início'} a ${pFim ? dataBR(pFim) : 'hoje'}`;
  let ant = null;
  if (mesSel) {
    const d = new Date(+mesSel.slice(0, 4), +mesSel.slice(5, 7) - 2, 1);
    const k = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    ant = ocColab.filter(o => o.data.startsWith(k));
  }
  const comp = fn => {
    if (!ant) return '';
    const a = fn(ant), v = fn(doPer);
    if (a === v) return `igual ao mês anterior (${a})`;
    return `${v > a ? '▲' : '▼'} ${Math.abs(v - a)} vs mês anterior (${a})`;
  };
  const pPer = presenca(doPer);
  const pAnt = ant ? presenca(ant) : null;
  const presAntTxt = pAnt && pAnt.pct != null ? ` · mês anterior ${pAnt.pct}%` : '';
  // Soma de horas de um tipo (atraso / declaração)
  const hrs = (lista, t, campo) => lista.filter(o => o.tipo === t).reduce((s, o) => s + (parseFloat(o[campo]) || 0), 0);
  const fmtH = v => { if (!v) return ''; const hh = Math.floor(v), mm = Math.round((v - hh) * 60); return mm ? `${hh}h${String(mm).padStart(2, '0')}` : `${hh}h`; };
  const fP = nAus(doPer), sjP = n(doPer, 'falta'), jP = nJust(doPer), oP = n(doPer, 'ferias');
  // "Outro" marcado como falta
  const nOutroF = l => l.filter(o => o.tipo === 'elogio' && ehFalta(o)).length;
  const nAtr = l => n(l, 'atraso');
  const hAtr = hrs(doPer, 'atraso', 'horas');
  // Card de Faltas (largo) com o detalhamento dentro: sem justificativa, justificadas, outros e atrasos
  // Comparação curta para os itens de dentro do card: "▲ 1 (ant. 0)"
  const compC = fn => { if (!ant) return ''; const a = fn(ant), v = fn(doPer); return a === v ? `= mês ant. (${a})` : `${v > a ? '▲' : '▼'} ${Math.abs(v - a)} (ant. ${a})`; };
  const sub = (rot, v, cor, c, extra = '') => `<div class="st-sub-item"><span>${rot}</span><b style="color:${v ? cor : '#0f172a'}">${v}</b><small>${c || extra || '&nbsp;'}</small></div>`;
  const cardFaltas = `<div class="st-tile st-largo ${fP ? 'vermelho' : 'verde'}">
      <div class="st-largo-top"><span>Faltas (total)</span><b>${fP}</b><small>${comp(nAus) || (fP ? '' : 'nenhuma')}</small></div>
      <div class="st-sub">
        ${sub('Sem justificativa', sjP, '#b91c1c', compC(l => n(l, 'falta')))}
        ${sub('Justificadas', jP, '#b45309', compC(nJust), 'atestado ou declaração')}
        ${sub('Outros', nOutroF(doPer), '#b91c1c', compC(nOutroF), '"outro" como falta')}
        ${sub('Atrasos', nAtr(doPer), '#a16207', compC(nAtr) && hAtr ? `${fmtH(hAtr)} · ${compC(nAtr)}` : compC(nAtr), hAtr ? `${fmtH(hAtr)} no total` : 'não conta como falta')}
      </div>
    </div>`;
  const tilesPer = cardFaltas + [
    tile('Presença', pPer.pct == null ? '—' : `${pPer.pct}%`, corPres(pPer.pct), pPer.b ? `${pPer.p} de ${pPer.b} dias${presAntTxt}` : 'sem registros'),
    tile('Férias', oP, '', comp(l => n(l, 'ferias')) || 'não conta como falta'),
    tile('Declarações', n(doPer, 'declaracao'), '', hrs(doPer, 'declaracao', 'horas') ? `${fmtH(hrs(doPer, 'declaracao', 'horas'))} · ${fmtH(hrs(doPer, 'declaracao', 'horas_abono')) || '0h'} abonadas` : 'com presença'),
  ].join('');

  // Últimos 6 meses: presenças, justificadas e faltas empilhadas
  const meses = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); meses.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); }
  // Só presença (verde) e falta (vermelho): justificada também é falta
  const porMes = meses.map(k => { const l = ocColab.filter(o => o.data.startsWith(k)); return { k, p: presencaDias(l).p, f: nAus(l) }; });
  const maxM = Math.max(1, ...porMes.map(m => m.p + m.f));
  const MES_AB = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const barras = porMes.map(m => {
    const aus = m.f, tot = m.p + aus, h = tot / maxM * 88;
    const seg = (v, c) => v ? `<i style="height:${v / tot * 100}%;background:${c}"></i>` : '';
    const sel = m.k === mesSel;
    return `<div title="${MES_AB[+m.k.slice(5) - 1]}: ${m.p} presenças, ${aus} faltas">
      <em>${aus ? `<span style="color:#dc2626">${aus}</span>` : ''}</em>
      <div class="st-pilha" style="height:${Math.max(3, h)}px${sel ? ';box-shadow:0 0 0 2px #0f5132' : ''}">${seg(m.p, '#4ade80')}${seg(m.f, '#ef4444')}</div>
      <span${sel ? ' style="color:#0f5132;font-weight:800"' : ''}>${MES_AB[+m.k.slice(5) - 1]}</span></div>`;
  }).join('');

  // Faltas (todas as ausências) por dia da semana (seg a sáb)
  const ausencias = ocColab.filter(ehFalta);
  const porDia = [1, 2, 3, 4, 5, 6].map(w => ({ w, v: ausencias.filter(o => new Date(o.data + 'T00:00:00').getDay() === w).length }));
  const maxD = Math.max(1, ...porDia.map(x => x.v));
  const dias = ausencias.length ? porDia.map(x => `<div class="st-dia"><span>${DIAS_AB[x.w]}</span><div class="tr"><i style="width:${x.v / maxD * 100}%"></i></div><b>${x.v}</b></div>`).join('')
    : '<div class="st-vazio">Nenhuma falta registrada.</div>';

  // Avaliações: média por critério
  const ROT = { relacionamento:'Relacion.', responsabilidade:'Respons.', cooperacao:'Cooperação', conhecimento_trabalho:'Conhecim.', interesse:'Interesse', atitude_profissional:'Atitude', produtividade:'Produtiv.' };
  const corNota = v => v >= 7 ? '#22c55e' : v >= 5 ? '#f59e0b' : '#ef4444';
  const crit = CRITERIOS.map(k => { const vs = avalsColab.map(a => parseFloat(a[k]) || 0).filter(v => v > 0); return { k, v: vs.length ? vs.reduce((s, x) => s + x, 0) / vs.length : null }; }).filter(x => x.v != null);
  const ultAval = avalsColab.map(a => a.data_avaliacao).filter(Boolean).sort().pop();
  // Quadradinhos com as notas, igual ao card do RH: uma linha por avaliação (mais recente primeiro)
  const ROT_Q = ['Relac.','Resp.','Coop.','Conhec.','Inter.','Atitude','Produt.'];
  const corQ = v => v >= 7 ? '#16a34a' : v >= 5 ? '#d97706' : v > 0 ? '#dc2626' : '#94a3b8';
  const mediaAv = a => { const vs = CRITERIOS.map(k => parseFloat(a[k]) || 0).filter(v => v > 0); return vs.length ? vs.reduce((s, x) => s + x, 0) / vs.length : null; };
  const avalOrd = [...avalsColab].sort((a, b) => (b.data_avaliacao || '').localeCompare(a.data_avaliacao || ''));
  const pills = val => CRITERIOS.map((k, i) => { const v = val(k); return `<div class="crit-pill"><div class="cn" style="color:${corQ(v)}">${v == null || isNaN(v) ? '—' : +v.toFixed(1)}</div><div class="cl">${ROT_Q[i]}</div></div>`; }).join('');
  // Histórico completo (abre no modal ao clicar na média final)
  avalHistHTML = avalOrd.map(a => {
      const m = mediaAv(a);
      return `<div class="aval-item">
        <div class="aval-top"><span style="font-size:12px;color:#64748b">${dataBR(a.data_avaliacao) || ''}${a.avaliador ? ` · ${a.avaliador}` : ''}</span>
          <span class="aval-nota" style="color:${corQ(m)}">${m !== null ? m.toFixed(1) : '—'}</span></div>
        <div class="aval-criterios">${pills(k => parseFloat(a[k]))}</div>
        ${a.observacoes ? `<p style="margin:8px 0 0;font-size:12px;color:#475569;background:#fff;padding:6px 10px;border-radius:6px;border:1px solid #e2e8f0">${a.observacoes}</p>` : ''}
      </div>`;
    }).join('');
  // No painel: só a média final (média de cada critério em todas as avaliações)
  const mediaFinal = crit.length ? crit.reduce((s, x) => s + x.v, 0) / crit.length : null;
  const mediaCrit = Object.fromEntries(crit.map(x => [x.k, x.v]));
  const avalHTML = avalOrd.length ? `<div class="aval-item aval-resumo" id="aval-resumo" title="Clique para ver o histórico completo">
        <div class="aval-top"><span style="font-size:12px;color:#64748b;font-weight:700">MÉDIA FINAL</span>
          <span class="aval-nota" style="color:${corQ(mediaFinal)}">${mediaFinal !== null ? mediaFinal.toFixed(1) : '—'}</span></div>
        <div class="aval-criterios">${pills(k => mediaCrit[k] ?? null)}</div>
      </div>
      <div class="st-leg" style="margin-top:10px">${avalsColab.length} avaliaç${avalsColab.length === 1 ? 'ão' : 'ões'}${ultAval ? ` · última em ${dataBR(ultAval)}` : ''} · <a href="#" id="aval-ver" style="color:#0f5132;font-weight:700">ver histórico →</a></div>`
    : '<div class="st-vazio">Nenhuma avaliação registrada.</div>';

  el.innerHTML = `
    <div class="st-sec">No período · <span style="color:#0f5132">${rotPer}</span></div>
    <div class="st-tiles">${tilesPer}</div>
    <div class="st-sec">Consolidado</div>
    <div class="st-tiles">${tiles}</div>
    <div class="st-sec">Últimos 6 meses</div>
    <div class="st-graf">
      <div class="st-box"><h4>Presenças e ausências por mês</h4><div class="st-barras">${barras}</div>
        <div class="st-leg"><span><i style="background:#4ade80"></i>Presente</span><span><i style="background:#ef4444"></i>Falta</span></div></div>
      <div class="st-box"><h4>Faltas por dia da semana</h4><div class="st-dias">${dias}</div></div>
    </div>
    <div class="st-sec">Avaliação de desempenho</div>
    <div class="st-box">${avalHTML}</div>`;
  const abrirHistAval = e => { e?.preventDefault(); document.getElementById('modal-aval-body').innerHTML = avalHistHTML; abrirModal('modal-aval'); };
  document.getElementById('aval-resumo')?.addEventListener('click', abrirHistAval);
  document.getElementById('aval-ver')?.addEventListener('click', abrirHistAval);
}
let avalHistHTML = '';

function renderTudoFiltrado() {
  renderKPIs();
  renderHistorico();
  renderEstatisticas();
}

function ocFiltradas(doHistorico = false) {
  const p = doHistorico ? 'h' : 'f';
  const ini  = document.getElementById(`${p}-ini`).value;
  const fim  = document.getElementById(`${p}-fim`).value;
  const tipo = doHistorico ? document.getElementById('h-tipo').value : '';
  return ocColab.filter(o => {
    if (ini && o.data < ini) return false;
    if (fim && o.data > fim) return false;
    if (tipo === '@falta') { if (!ehFalta(o)) return false; }
    else if (tipo && o.tipo !== tipo) return false;
    return true;
  }).sort((a,b) => b.data.localeCompare(a.data));
}

function renderKPIs() {
  const lista = ocFiltradas();
  const count = tipo => lista.filter(o => o.tipo === tipo).length;
  // Presença no período: presentes sobre os dias com registro (justificada e férias também contam como falta)
  const pr = presencaDias(lista);
  const el = document.getElementById('co-pres');
  if (el) el.innerHTML = pr.pct != null ? `${pr.pct}<small>%</small>` : '—';
}

function renderHistorico() {
  const lista = ocFiltradas(true);
  const isAdm = perfil?.role === 'admin';
  const nTop = ocFiltradas().length;
  document.getElementById('hist-count').textContent = `${nTop} registro${nTop === 1 ? '' : 's'} no período · para conferir com o cartão ponto`;
  // Resumo do que está filtrado na tela do histórico
  const cnt = t => lista.filter(o => o.tipo === t).length;
  document.getElementById('h-resumo').innerHTML = `<span style="background:#e2e8f0;color:#334155">${lista.length} registro${lista.length === 1 ? '' : 's'}</span>`
    + ['outro','atraso','declaracao','elogio','advertencia','falta','atestado','falta_declaracao','ferias'].filter(t => cnt(t)).map(t => `<span style="${TIPO_COR[t]}">${cnt(t)} ${TIPO_LABEL[t].toLowerCase()}</span>`).join('');
  if (!lista.length) { document.getElementById('hist-lista').innerHTML = '<p class="hist-empty">Nenhuma ocorrência no período selecionado.</p>'; return; }
  // Agrupa por mês
  const grupos = [];
  lista.forEach(o => {
    const k = o.data.slice(0, 7);
    let g = grupos.find(x => x.k === k);
    if (!g) grupos.push(g = { k, itens: [] });
    g.itens.push(o);
  });
  document.getElementById('hist-lista').innerHTML = grupos.map(g => {
    const [y, m] = g.k.split('-').map(Number);
    return `<div class="hist-mes"><span>${MESES[m - 1]} de ${y}</span><span>${g.itens.length}</span></div>` + g.itens.map(o => {
      const dia = new Date(o.data + 'T00:00:00').getDay();
      return `<div class="hist-row" style="--c:${TIPO_PONTO[o.tipo] || '#94a3b8'}">
        <span class="hist-data">${dataBR(o.data).slice(0, 5)}<small>${DIAS_AB[dia]}</small></span>
        <span class="hist-tipo" style="${TIPO_COR[o.tipo]||'background:#f1f5f9;color:#475569'}">${esc(rotuloOc(o))}</span>
        <span class="hist-desc" title="${esc(o.descricao || '')}">${esc(o.descricao || '')}</span>
        ${isAdm ? `<span class="hist-acoes">
          <button class="btn-icon" onclick="window._editarOc('${o.id}')" title="Editar">${icon('edit',{size:15})}</button>
          <button class="btn-icon danger" onclick="window._excluirOc('${o.id}')" title="Excluir">${icon('trash',{size:15})}</button>
        </span>` : ''}
      </div>`;
    }).join('');
  }).join('');
}

function renderCalendario() {
  const first        = new Date(calYear, calMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth  = new Date(calYear, calMonth + 1, 0).getDate();
  const hoje         = hojeISO();

  document.getElementById('cal-titulo').textContent = `${MESES[calMonth]} de ${calYear}`;

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-day cal-day-empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    // Registro principal do dia: qualquer falta vem primeiro; depois a ordem de "gravidade"
    const ocsDia  = ocColab.filter(o => o.data === dateStr).sort((a, b) => (ehFalta(b) - ehFalta(a)) || ((TIPO_PESO[a.tipo] ?? 9) - (TIPO_PESO[b.tipo] ?? 9)));
    const princ   = ocsDia[0];
    const wd      = (startWeekday + d - 1) % 7;
    const falta   = princ && ehFalta(princ);
    const feriado = nomeFeriado(dateStr);
    // Falta (com ou sem justificativa) sempre em vermelho; feriado sem lançamento fica marcado como feriado
    const tCls = falta ? 't-falta' : princ ? `t-${princ.tipo}` : feriado ? 't-feriado' : '';
    const cls = ['cal-day', tCls, wd === 0 || wd === 6 ? 'fds' : '', dateStr === hoje ? 'hoje' : '', dateStr > hoje ? 'futuro' : ''].filter(Boolean).join(' ');
    const dica = [feriado && `Feriado: ${feriado}`, ...ocsDia.map(o => `${rotuloOc(o)}${o.descricao ? ' — ' + o.descricao : ''}`)].filter(Boolean).join('\n');
    // Duas linhas: a situação do dia (Presente / Falta) e, embaixo, o motivo
    const rc = princ ? rotuloCal(princ) : null;
    const corTxt = falta ? '#dc2626' : (TIPO_PONTO[princ?.tipo] || '#64748b');
    const rot = princ ? `<span class="cal-tipo" style="color:${corTxt}"><i style="background:${TIPO_PONTO[princ.tipo] || '#94a3b8'}"></i>${rc.situacao}${ocsDia.length > 1 ? ` +${ocsDia.length - 1}` : ''}</span>${rc.motivo || feriado ? `<span class="cal-mot">${esc(rc.motivo || 'feriado')}${rc.motivo && feriado ? ' · feriado' : ''}</span>` : ''}`
      : feriado ? `<span class="cal-tipo" style="color:#a16207"><i style="background:#eab308"></i>Feriado</span><span class="cal-mot">${esc(feriado)}</span>` : '';
    cells += `<div class="${cls}" onclick="window._abrirNovaOcData('${dateStr}')" title="${esc(dica)}">
      <div class="cal-daynum">${d}</div>${rot}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cells;
}

// ── Modal Ocorrência ─────────────────────────────────────────────────────────
function abrirNovaOc(data) {
  if (perfil?.role !== 'admin') return;
  document.getElementById('modal-oc-title').textContent = 'Nova Ocorrência';
  document.getElementById('form-oc').reset();
  resetFormOc();
  document.querySelector('#form-oc [name="id"]').value = '';
  document.querySelector('#form-oc [name="data"]').value = data;
  document.getElementById('btn-excluir-oc').style.display = 'none';
  abrirModal('modal-oc');
}

window._abrirNovaOcData = data => {
  const existentes = ocColab.filter(o => o.data === data);
  if (existentes.length) { window._editarOc(existentes[0].id); return; }
  abrirNovaOc(data);
};

window._editarOc = id => {
  if (perfil?.role !== 'admin') return;
  const o = ocColab.find(x => x.id === id); if (!o) return;
  document.getElementById('modal-oc-title').textContent = 'Editar Ocorrência';
  const f = document.getElementById('form-oc');
  f.querySelector('[name="id"]').value = o.id;
  f.querySelector('[name="data"]').value = o.data;
  f.querySelector('[name="descricao"]').value = o.descricao || '';
  preencherFormOc(o);
  document.getElementById('btn-excluir-oc').style.display = '';
  abrirModal('modal-oc');
};

window._excluirOc = async id => {
  if (!confirm('Excluir esta ocorrência?')) return;
  const { error } = await supabase.from('ocorrencias').delete().eq('id', id);
  if (error) { toast('Erro ao excluir', 'error'); return; }
  toast('Ocorrência excluída!');
  await carregarOcorrencias();
};

async function excluirOcAtual() {
  const id = document.querySelector('#form-oc [name="id"]').value;
  if (!id) return;
  if (!confirm('Excluir esta ocorrência?')) return;
  const { error } = await supabase.from('ocorrencias').delete().eq('id', id);
  if (error) { toast('Erro ao excluir', 'error'); return; }
  toast('Ocorrência excluída!');
  fecharModal('modal-oc');
  await carregarOcorrencias();
}

async function salvarOc() {
  const f = document.getElementById('form-oc');
  if (!f.checkValidity()) { f.reportValidity(); return; }
  const oc = lerFormOc();
  if (oc.erro) { toast(oc.erro, 'error'); return; }
  const fd = Object.fromEntries(new FormData(f));
  const payload = { colaborador_id: colabId, tipo: oc.tipo, data: fd.data, descricao: fd.descricao || null, conta_como_falta: oc.conta_como_falta, horas: oc.horas, horas_abono: oc.horas_abono, hora_chegada: oc.hora_chegada };
  const { error } = await gravarOcorrencia(supabase, fd.id || null, payload);
  if (error) {
    const msg = /tipo_check/i.test(error.message || '') ? 'Este tipo ainda não está liberado no banco. Rode o supabase-patch41.sql no Supabase.' : 'Erro: ' + error.message;
    toast(msg, 'error'); return;
  }
  toast(fd.id ? 'Ocorrência atualizada!' : 'Ocorrência registrada!');
  const { error: presErr } = oc.presente === null ? {} : await supabase.from('presenca_diaria').upsert(   // advertência não mexe na presença
    [{ colaborador_id: colabId, data: fd.data, presente: oc.presente, observacao: fd.descricao || null }],
    { onConflict: 'colaborador_id,data' }
  );
  if (presErr) toast('Erro ao salvar presença: ' + presErr.message, 'error');
  fecharModal('modal-oc');
  await carregarOcorrencias();
}

await init();
</script>

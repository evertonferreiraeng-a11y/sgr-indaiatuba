<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#006636" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SGR Indaiatuba" />
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="img/icons/icon-192.png" />
  <title>Dashboard — SGR Indaiatuba</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    .main-content { min-width:0; }
    .page-body > * { min-width:0; }

    /* ── Topo ── */
    .db-controles { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .db-controles .form-group { min-width:150px; }
    .db-corte { font-size:12px; color:var(--text-muted); line-height:1.4; }
    .db-corte b { color:var(--text); }

    /* ── Manchete ── */
    .db-manchete { background:linear-gradient(135deg,#004d28 0%,#006636 60%,#0a7a40 100%); color:#fff; border-radius:var(--radius-lg); padding:22px 26px; margin-bottom:16px; }
    .db-manchete .tag { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#a7f3d0; }
    .db-manchete h1 { font-size:21px; line-height:1.35; margin:6px 0 0; font-weight:700; }
    .db-manchete .ok  { color:#86efac; } .db-manchete .ruim { color:#fecaca; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
    .db-manchete h1 b { color:#fff; background:rgba(255,255,255,.12); padding:0 4px; border-radius:4px; }
    .mc-linhas { margin-top:14px; display:flex; flex-direction:column; gap:26px; padding-top:18px; }
    .mc-linha { display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:center; }
    .mc-nome { font-weight:800; font-size:14px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
    .mc-barra { position:relative; height:32px; background:rgba(255,255,255,.16); border-radius:8px; }
    .mc-barra > i { position:absolute; top:0; bottom:0; left:0; border-radius:8px; display:flex; align-items:center; overflow:hidden; font-style:normal; }
    .mc-barra > i span { padding:0 10px; font-size:13px; font-weight:800; white-space:nowrap; }
    .mc-barra i.feito { background:#fff; color:#064e3b; }
    .mc-barra i.est { background:rgba(255,255,255,.42); color:#fff; border-radius:0 8px 8px 0; }
    .mc-barra .fora { position:absolute; top:50%; transform:translateY(-50%); font-size:13px; font-weight:800; white-space:nowrap; color:#fff; }
    .mc-esp { position:absolute; top:-6px; width:3px; height:44px; background:#fde047; border-radius:2px; transform:translateX(-1px); z-index:2; }
    .mc-esp em { position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11.5px; font-weight:700; color:#fde047; white-space:nowrap; }
    .mc-fim { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12px; font-weight:700; color:#d1fae5; white-space:nowrap; }
    .mc-st { font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap; }
    .mc-st.ok { background:#dcfce7; color:#166534; } .mc-st.amb { background:#fef3c7; color:#92400e; } .mc-st.verm { background:#fee2e2; color:#991b1b; } .mc-st.nd { background:rgba(255,255,255,.2); color:#fff; }
    .mc-leg { display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; font-size:11.5px; color:#bbf7d0; }
    .mc-leg i { display:inline-block; width:12px; height:8px; border-radius:3px; margin-right:5px; vertical-align:0; }
    .mc-leg i.f { background:#fff; } .mc-leg i.e { background:rgba(255,255,255,.45); } .mc-leg i.m { width:3px; height:12px; background:#fde047; vertical-align:-2px; }
    .db-manchete .badge-parcial { display:inline-block; margin-top:10px; background:rgba(255,255,255,.14); border-radius:999px; padding:3px 10px; font-size:12px; }

    /* ── Semáforos ── */
    .db-sem { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px; }
    .db-ind { background:var(--card-bg); border:1px solid var(--border); border-left:6px solid var(--border); border-radius:var(--radius); padding:14px 16px; cursor:pointer; transition:box-shadow .15s, transform .15s; text-align:left; font:inherit; color:inherit; }
    .db-ind:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
    .db-ind.ok { border-left-color:var(--success); } .db-ind.amb { border-left-color:#d97706; } .db-ind.verm { border-left-color:var(--danger); } .db-ind.nd { border-left-color:#cbd5e1; }
    .db-ind .hd { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .db-ind .rot { font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); }
    .selo { font-size:10.5px; font-weight:800; letter-spacing:.05em; padding:3px 8px; border-radius:999px; white-space:nowrap; }
    .selo.ok { background:#dcfce7; color:#166534; } .selo.amb { background:#fef3c7; color:#92400e; } .selo.verm { background:#fee2e2; color:#991b1b; } .selo.nd { background:#f1f5f9; color:#64748b; }
    .db-ind .val { font-size:22px; font-weight:800; margin:8px 0 2px; letter-spacing:-.01em; }
    .db-ind .sub { font-size:12.5px; color:var(--text-muted); }
    .db-ind .mot { font-size:12.5px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
    .db-ind .mot b { color:var(--danger); } .db-ind.amb .mot b { color:#b45309; }
    .barra { height:6px; background:#eef2f6; border-radius:4px; margin-top:10px; position:relative; overflow:visible; }
    .barra i { display:block; height:100%; border-radius:4px; max-width:100%; }
    .barra .esp { position:absolute; top:-3px; width:2px; height:12px; background:#0f172a; border-radius:1px; }

    /* ── Navegação de seções ── */
    .db-nav { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:6px; overflow-x:auto; padding:10px 0; margin-bottom:6px; }
    .db-nav a { white-space:nowrap; font-size:12.5px; font-weight:600; color:var(--text-muted); text-decoration:none; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:#fff; }
    .db-nav a:hover { color:var(--primary); border-color:var(--primary-border); }

    /* ── Seções ── */
    .db-sec { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; margin-bottom:16px; scroll-margin-top:60px; }
    .db-sec-hd { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
    .db-sec-hd h2 { font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--primary); margin:0; }
    .db-sec-hd a { font-size:12px; font-weight:600; color:var(--primary); text-decoration:none; }
    .db-frase { font-size:14.5px; line-height:1.55; color:var(--text); margin:0 0 16px; max-width:980px; }
    .db-frase .ok { color:var(--success); font-weight:700; } .db-frase .ruim { color:var(--danger); font-weight:700; }
    .db-corpo { display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start; }
    .db-corpo > *, .db-sem > *, .db-grid4 > * { min-width:0; }
    .db-cards { display:flex; flex-direction:column; gap:10px; }
    .db-card { border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; background:#fff; }
    .db-card.dest { background:var(--primary-bg); border-color:var(--primary-border); }
    .db-card .rot { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .db-card .val { font-size:20px; font-weight:800; margin:4px 0 2px; }
    .db-card .sub { font-size:12.5px; color:var(--text-muted); }
    .mt-barra { position:relative; height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:10px; }
    .mt-barra i { position:absolute; top:0; bottom:0; left:0; }
    .mt-barra i.f { background:var(--primary); } .mt-barra i.e { background:#86c5a0; }
    .mt-lns { margin-top:12px; display:flex; flex-direction:column; }
    .mt-ln { display:grid; grid-template-columns:1fr auto 44px; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid #e5efe8; font-size:13px; }
    .mt-ln:first-child { border-top:0; }
    .mt-ln span { color:var(--text); } .mt-ln b { font-size:15px; } .mt-ln em { font-style:normal; font-size:12px; color:var(--text-muted); text-align:right; }
    .mt-ln i { display:inline-block; width:9px; height:9px; border-radius:2px; background:#e5e7eb; margin-right:7px; }
    .mt-ln i.f { background:var(--primary); } .mt-ln i.e { background:#86c5a0; }
    .mt-ln.tot { border-top:1px solid var(--primary-border); margin-top:2px; padding-top:9px; }
    .mt-ln.tot span { font-weight:700; } .mt-ln.tot b { font-size:18px; color:#b45309; }
    .mt-barra .mk { position:absolute; top:0; bottom:0; width:2px; background:#0f172a; transform:translateX(-1px); }
    .mt-ln i.m { background:#0f172a; width:3px; border-radius:1px; }
    /* prensas */
    .pr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; }
    .pr-card { border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; background:#fff; }
    .pr-hd { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13px; }
    .pr-pct { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
    .pr-card .mt-barra { height:8px; margin-top:8px; }
    .pr-card .mt-barra i { border-radius:999px; }
    .pr-sub { font-size:12px; color:var(--text-muted); margin-top:6px; }
    /* equipamentos com problema */
    .pb-lista { display:flex; flex-direction:column; gap:8px; }
    .pb-item { border:1px solid var(--border); border-left:4px solid #d97706; border-radius:var(--radius); padding:10px 12px; background:#fff; }
    .pb-item.par { border-left-color:var(--danger); }
    .pb-hd { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13.5px; }
    .pb-st { font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:#fef3c7; color:#92400e; white-space:nowrap; }
    .pb-item.par .pb-st { background:#fee2e2; color:#991b1b; }
    .pb-prob { font-size:13px; margin-top:4px; } .pb-prob i { color:var(--text-muted); }
    .pb-meta { font-size:12px; color:var(--text-muted); margin-top:4px; }
    .pb-ok { border:1px dashed var(--border); border-radius:var(--radius); padding:12px; font-size:13px; color:var(--success); font-weight:600; }
    .chart-wrap { position:relative; height:280px; }
    .up { color:var(--success); } .down { color:var(--danger); } .amb-t { color:#b45309; }

    .db-grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
    .db-mini-t { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin:4px 0 10px; }

    /* Barras horizontais */
    .hb { display:grid; grid-template-columns:120px 1fr 150px; gap:10px; align-items:center; font-size:13px; margin:7px 0; }
    .hb .trilho { height:12px; background:#eef2f6; border-radius:6px; position:relative; overflow:hidden; }
    .hb .trilho i { position:absolute; left:0; top:0; bottom:0; border-radius:6px; }
    .hb .v { text-align:right; font-variant-numeric:tabular-nums; }
    .trilho-m { height:12px; background:#eef2f6; border-radius:6px; position:relative; }
    .trilho-m i { position:absolute; left:0; top:0; bottom:0; border-radius:6px; }
    .trilho-m .esp { position:absolute; top:-3px; width:2px; height:18px; background:#0f172a; border-radius:1px; }
    .trilho-m .esp.hoje { background:#94a3b8; }
    table.db-mat tr.tot td { background:#f8fafc; border-top:2px solid var(--border); }
    table.db-mat td { vertical-align:middle; }
    .mb-lista { display:flex; flex-direction:column; gap:4px; }
    .mb-row { display:grid; grid-template-columns:200px 1fr 26px; gap:14px; align-items:center; padding:7px 8px; border-radius:8px; cursor:default; outline:none; }
    .mb-row:hover, .mb-row:focus { background:#f8fafc; }
    .mb-row.tot { border-top:1px solid var(--border); margin-top:6px; padding-top:12px; border-radius:0 0 8px 8px; }
    .mb-nome b { display:block; font-size:13px; } .mb-nome span { font-size:11px; color:var(--text-muted); }
    .mb-barra { position:relative; height:16px; background:#eef2f6; border-radius:8px; }
    .mb-barra > i { position:absolute; left:0; top:0; bottom:0; border-radius:8px; }
    .mb-barra .mk { position:absolute; top:-4px; width:3px; height:24px; border-radius:2px; transform:translateX(-1px); }
    .mb-barra .mk.med { background:#0f172a; } .mb-barra .mk.esp { background:#94a3b8; }
    .mb-st { font-size:13px; font-weight:800; text-align:center; color:var(--text-muted); }
    .mb-st.up { color:var(--success); } .mb-st.down { color:var(--danger); }
    .mb-leg { display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-muted); }
    .mb-leg i { display:inline-block; vertical-align:-1px; margin-right:5px; border-radius:2px; }
    .mb-leg i.b { width:14px; height:9px; background:var(--primary); } .mb-leg i.m { width:3px; height:12px; background:#0f172a; } .mb-leg i.e { width:3px; height:12px; background:#94a3b8; }
    .mb-leg .dica { margin-left:auto; font-style:italic; }
    #db-tip { position:fixed; z-index:50; pointer-events:none; background:#0f172a; color:#fff; border-radius:10px; padding:10px 12px; font-size:12.5px; min-width:250px; box-shadow:0 10px 24px rgba(15,23,42,.25); opacity:0; transition:opacity .1s; }
    #db-tip.on { opacity:1; }
    #db-tip .tip-t { font-weight:800; font-size:13px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,.15); }
    #db-tip .tip-l { display:flex; justify-content:space-between; gap:16px; padding:2px 0; }
    #db-tip .tip-l span { color:#cbd5e1; } #db-tip .up { color:#86efac; } #db-tip .down { color:#fca5a5; }
    @media (max-width: 600px) { .mb-row { grid-template-columns:110px 1fr 20px; gap:8px; } .mb-leg .dica { margin-left:0; } }
    .pilha { display:flex; height:22px; border-radius:6px; overflow:hidden; margin:6px 0 8px; }
    .pilha i { display:block; height:100%; }
    .leg { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); }
    .leg span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--c); }

    /* Tabelas */
    table.db { width:100%; border-collapse:collapse; font-size:13px; }
    table.db th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); text-align:left; padding:8px 10px; background:#f8fafc; border-bottom:1px solid var(--border); }
    table.db td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    table.db td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .st-pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }

    /* Lembrete de experiência */
    .exp-lembrete { display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:10px 14px; margin-bottom:16px; }
    .exp-lembrete-hd { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:#92400e; white-space:nowrap; }
    .exp-ic { font-size:15px; }
    .exp-n { background:#d97706; color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; }
    .exp-itens { display:flex; gap:8px; flex-wrap:wrap; flex:1; }
    .exp-item { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #fde68a; border-radius:999px; padding:5px 6px 5px 12px; font-size:12.5px; color:#78350f; text-decoration:none; transition:border-color .15s, box-shadow .15s; }
    .exp-item:hover { border-color:#d97706; box-shadow:0 1px 4px rgba(217,119,6,.2); }
    .exp-item em { font-style:normal; font-weight:700; font-size:11.5px; color:#fff; background:var(--primary); border-radius:999px; padding:3px 9px; }

    /* ── Cabeçalho ── */
    .db-hero { display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:28px; align-items:center; color:#fff;
      background:radial-gradient(120% 140% at 100% 0%, #0f8a4e 0%, rgba(15,138,78,0) 55%), linear-gradient(135deg,#003d20 0%,#005a30 55%,#006e3a 100%);
      border-radius:var(--radius-lg); padding:22px 26px; margin-bottom:16px; box-shadow:0 10px 26px rgba(0,77,40,.22); position:relative; overflow:hidden; }
    .db-hero::after { content:"♻"; position:absolute; right:-18px; bottom:-46px; font-size:170px; line-height:1; color:rgba(255,255,255,.05); pointer-events:none; }
    .db-hero > * { position:relative; z-index:1; }
    .db-hero-tit { display:flex; align-items:center; gap:14px; }
    .db-hero-ic { width:52px; height:52px; border-radius:14px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); color:#fff; display:grid; place-items:center; font-size:26px; flex:none; }
    .db-hero h1 { font-size:24px; font-weight:800; margin:0; letter-spacing:-.02em; color:#fff; }
    .db-hero p { margin:3px 0 0; font-size:13px; color:#bbf7d0; font-weight:500; }
    .db-hero-mes { flex:none; display:flex; align-items:center; border:1px solid rgba(255,255,255,.25); border-radius:12px; background:rgba(255,255,255,.1); overflow:hidden; }
    .db-hero-mes button { border:none; background:none; width:40px; height:44px; font-size:22px; line-height:1; color:#fff; cursor:pointer; }
    .db-hero-mes button:hover { background:rgba(255,255,255,.14); }
    .db-hero-mes input { border:none; border-left:1px solid rgba(255,255,255,.2); border-right:1px solid rgba(255,255,255,.2); border-radius:0; background:#fff; color:#064e3b; width:190px; min-width:190px; height:44px; font-weight:800; font-size:14.5px; text-align:center; box-shadow:none; }
    .db-corte { min-width:0; max-width:420px; }
    .db-stats { display:flex; gap:22px; }
    .db-stat span { display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#a7f3d0; }
    .db-stat b { font-size:24px; font-weight:800; line-height:1.1; color:#fff; font-variant-numeric:tabular-nums; }
    .db-stat small { font-size:13px; font-weight:600; color:#d1fae5; }
    .db-corte-bar { height:8px; background:rgba(255,255,255,.18); border-radius:5px; margin:10px 0 7px; overflow:hidden; }
    .db-corte-bar i { display:block; height:100%; background:linear-gradient(90deg,#86efac,#fde047); border-radius:5px; }
    .db-corte-sub { display:flex; align-items:center; gap:10px; font-size:12px; color:#d1fae5; white-space:nowrap; }
    .db-pill { font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap; }
    .db-pill.and { background:#dcfce7; color:#166534; } .db-pill.fech { background:rgba(255,255,255,.2); color:#fff; }
    .db-hero-acoes { display:flex; gap:10px; justify-content:flex-end; }
    .db-hero-acoes .btn-outline { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.35); }
    .db-hero-acoes .btn-outline:hover { background:rgba(255,255,255,.16); border-color:#fff; }
    .db-hero-acoes .btn-primary { background:#fff; color:#064e3b; box-shadow:0 2px 8px rgba(0,0,0,.15); }
    .db-hero-acoes .btn-primary:hover { background:#ecfdf5; }
    @media (max-width: 1560px) { .db-hero { grid-template-columns:auto auto minmax(0,1fr); } .db-hero-acoes { grid-column:1 / -1; justify-content:flex-start; } }
    @media (max-width: 1100px) { .db-hero { grid-template-columns:1fr auto; } .db-corte { grid-column:1 / -1; max-width:none; } .db-hero-acoes { grid-column:1 / -1; justify-content:flex-start; } }
    @media (max-width: 600px) { .exp-itens { flex-direction:column; } .exp-item { border-radius:10px; width:100%; } .exp-item em { margin-left:auto; } .db-hero { grid-template-columns:1fr; gap:16px; padding:18px; } .db-hero-mes { justify-self:start; } .db-hero-mes input { width:160px; } .db-stats { gap:16px; } .db-stat b { font-size:20px; } .db-corte { min-width:0; } }

    .db-q { font-size:17px !important; text-transform:none !important; letter-spacing:0 !important; color:var(--text) !important; display:inline; }

    /* ── Tela inicial: 4 cards grandes no meio ── */
    .db-home { min-height:calc(100vh - 290px); display:grid; align-content:center; padding:28px 0 36px; }
    .db-home-hd { margin:0 0 18px; }

    .db-home-hd p { margin:4px 0 0; font-size:13.5px; color:var(--text-muted); }
    .db-home .db-sem { gap:20px; margin:0; }
    .db-home .db-ind { --st:#94a3b8; --st-bg:#f1f5f9; position:relative; overflow:hidden; display:flex; flex-direction:column; min-height:290px;
      padding:24px 24px 20px; border:1px solid var(--border); border-radius:18px; background:#fff; box-shadow:var(--shadow-sm);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }

    .db-home .db-ind.ok   { --st:var(--success); --st-bg:#ecfdf3; }
    .db-home .db-ind.amb  { --st:#d97706; --st-bg:#fffbeb; }
    .db-home .db-ind.verm { --st:var(--danger); --st-bg:#fef2f2; }
    .db-home .db-ind:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:transparent; }

    .db-home .db-ind .hd { justify-content:flex-start; gap:12px; }
    .db-home .db-ind .selo { margin-left:auto; }
    .ind-ic { flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--st-bg); color:var(--st); }
    .db-home .db-ind .rot { font-size:12.5px; letter-spacing:.08em; }
    .db-home .db-ind .val { font-size:34px; line-height:1.1; margin:20px 0 6px; letter-spacing:-.03em; }
    .ind-ext { align-self:flex-start; font-size:12.5px; font-weight:700; color:var(--primary); background:var(--primary-bg); border:1px solid var(--primary-border); border-radius:999px; padding:3px 10px; margin-bottom:8px; }
    .db-home .db-ind .sub { font-size:13.5px; }
    .db-home .db-ind .barra { height:10px; margin-top:18px; border-radius:999px; background:#eef2f6; }
    .db-home .db-ind .barra i { border-radius:999px; }
    .db-home .db-ind .barra .esp { top:-4px; height:18px; width:3px; }
    .barra-leg { display:flex; justify-content:space-between; margin-top:6px; font-size:12px; color:var(--text-muted); }
    .barra-leg b { font-size:13px; }
    .db-home .db-ind .mot { font-size:13px; line-height:1.45; margin-top:14px; padding:10px 12px; border:0; border-radius:10px; background:var(--st-bg); }
    .db-ind .ver { margin-top:auto; padding-top:18px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--primary); }
    .db-ind .ver span { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--primary-bg); transition:transform .18s, background .18s, color .18s; }
    .db-ind:hover .ver span { transform:translateX(3px); background:var(--primary); color:#fff; }

    /* ── Janela de detalhes ── */
    .db-modal { position:fixed; inset:0; z-index:50; display:flex; justify-content:center; align-items:flex-start; padding:28px 20px; }
    .db-modal[hidden] { display:none; }
    .db-modal-fundo { position:absolute; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(2px); }
    .db-modal-caixa { position:relative; width:min(1400px, 100%); max-height:calc(100vh - 56px); overflow:auto; background:var(--bg); border-radius:16px; padding:22px 24px 12px; box-shadow:0 24px 60px rgba(0,0,0,.3); animation:dbSobe .18s ease-out; }
    @keyframes dbSobe { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .db-modal-x { position:sticky; top:0; float:right; z-index:2; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:#fff; font-size:22px; line-height:1; cursor:pointer; color:var(--text-muted); margin:-6px -8px 0 12px; }
    .db-modal-x:hover { color:var(--text); box-shadow:var(--shadow); }
    .db-modal-hd { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin:2px 0 14px; }
    .db-modal-hd h2 { font-size:22px; font-weight:800; margin:0; color:var(--text); }
    .db-modal-links { display:flex; gap:14px; } .db-modal-links a { font-size:13px; font-weight:600; color:var(--primary); text-decoration:none; }
    .db-modal .db-q-n { display:none; }
    .db-grid2 { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    body.db-modal-aberto { overflow:hidden; }
    /* preparando a impressão: tudo em sequência, sem a janela por cima */
    body.db-imprimindo .db-modal { position:static; padding:0; display:block; }

    body.db-imprimindo .db-modal-caixa { max-height:none; overflow:visible; box-shadow:none; padding:0; width:auto; animation:none; }
    @media (max-width: 600px) { .db-modal { padding:0; } .db-modal-caixa { max-height:100vh; border-radius:0; padding:16px; } .db-grid2 { grid-template-columns:1fr; } .db-home { min-height:0; } .db-home .db-ind { min-height:0; } }

    @media (max-width: 1100px) { .db-sem, .db-grid4 { grid-template-columns:repeat(2,1fr); } .db-corpo { grid-template-columns:1fr; } }
    @media (max-width: 600px) {
      .db-sem, .db-grid4 { grid-template-columns:1fr; }

      .mc-linha { grid-template-columns:1fr; gap:22px; } .mc-nome { flex-direction:row; align-items:center; } .mc-fim { display:none; } .mc-barra > i span, .mc-barra .fora { font-size:11.5px; } .mc-esp em { font-size:10px; }
      .hb { grid-template-columns:96px 1fr 90px; }

      .main-content { margin:0 !important; padding:0 !important; }
      .db-sec { break-inside:avoid; } .db-mais > summary { display:none; }
      /* impressão: todos os detalhes, um abaixo do outro */
      .db-modal, .db-modal[hidden], .db-painel[hidden] { display:block !important; position:static; padding:0; }
      .db-modal-fundo, .db-modal-x, .db-ind .ver { display:none !important; }

      body.db-modal-aberto { overflow:visible; }

  </style>

<body>
<div class="main-content">
  <div class="page-body">
    <header class="db-hero">
      <div class="db-hero-tit">
        <div class="db-hero-ic">♻</div>
        <div><h1>Dashboard</h1><p id="db-sub">UVR Indaiatuba</p></div>
      </div>
      <div class="db-hero-mes" role="group" aria-label="Mês de referência">
        <button type="button" id="mes-ant" title="Mês anterior">‹</button>
        <input type="month" id="f-mes" aria-label="Mês" />
        <button type="button" id="mes-prox" title="Próximo mês">›</button>
      </div>
      <div class="db-corte" id="db-corte"></div>
      <div class="db-hero-acoes">
        <button class="btn btn-outline" id="btn-print">Imprimir / PDF</button>
        <a class="btn btn-primary" href="apresentacao.html">Gerar apresentação →</a>
      </div>
    </header>

    <div id="db-lembrete"></div>
    <div id="db-conteudo"><div class="carregando">Carregando indicadores…</div></div>
  </div>
</div>

<script type="module">
import { initPage, supabase, toast } from './js/config.js?v=12';
import {
  STATUS_TAREFA, calcularDados, frasesPadrao, analiseEquilibrio, FIN_PADRAO, textoPerdaCap, periodoBusca,
  isoLocal, addDias, fimDoMes, ddmm, ddmmaaaa, nomeMes, cap, nomeMat, mil, tn, pct, reais0, nf,
} from './js/apresentacao.js?v=88';
import { equilibrioDoDRE } from './js/equilibrio-dre.js?v=1';

await initPage();

const hoje = isoLocal(new Date());
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const MES_AB = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const COR = { verde:'#006636', verdeCl:'#8fbfa3', s1:'#2a78d6', s2:'#eb6834', s3:'#1baf7a', s4:'#eda100', cinza:'#94a3b8', grid:'#e2e8f0', txt:'#64748b', ok:'#16803c', ruim:'#c8292a', amb:'#d97706' };
let charts = {};

// Frases da apresentação: **x** = verde (bom), *x* = vermelho (atenção)
const fraseHTML = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<span class="ok">$1</span>').replace(/\*([^*]+)\*/g, '<span class="ruim">$1</span>');

// "Dados até": mesma regra da apresentação — ontem (mês em andamento) ou fim do mês (mês fechado)
function corteDe(ym) {
  const ini = `${ym}-01`, fim = fimDoMes(ym);
  if (fim < hoje) return fim;
  const ontem = addDias(hoje, -1);
  return ontem < ini ? ini : ontem;
}

async function fetchAll(table, fields, filters = []) {
  const PAGE = 1000; let all = [], from = 0;
  while (true) {
    let q = supabase.from(table).select(fields).range(from, from + PAGE - 1);
    filters.forEach(([fn, ...args]) => { q = q[fn](...args); });
    const { data, error } = await q;
    if (error) throw error;
    if (!data || !data.length) break;
    all = all.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}
const fetchOpcional = (...a) => fetchAll(...a).catch(() => []);

// Estudo financeiro e acerto do mês: os mesmos valores salvos na tela Apresentação
function finAtual(M) {
  const n = (k, p) => { const v = parseFloat(lsGet(`sgr_apres_${k}`)); return isFinite(v) ? v : p; };
  return { pe:n('pe', FIN_PADRAO.pe), fixos:n('fixos', FIN_PADRAO.fixos), alvo:n('alvo', FIN_PADRAO.alvo), acerto:parseFloat(lsGet(`sgr_apres_acerto_${M}`)) || 0 };
}

/* ═════════════ Carga ═════════════ */
async function carregar() {
  const M = $('#f-mes').value; if (!M) return;
  const corte = corteDe(M);
  $('#db-conteudo').innerHTML = '<div class="carregando">Carregando indicadores…</div>';
  try {
    const { ini, iniMes } = periodoBusca(M);
    const fimBusca = corte > fimDoMes(M) ? fimDoMes(M) : corte;
    const [vendas, metas, producao, equipamentos, materiais, colaboradores, cargos, snapshots, tarefas, dre] = await Promise.all([
      fetchAll('vendas', 'data, peso_kg, unidade, valor_total, acondicionamento, materiais(nome)', [['gte','data',ini], ['lte','data',fimBusca]]),
      fetchAll('metas', 'periodo, valor_meta', [['eq','indicador','faturamento'], ['gte','periodo',ini.slice(0, 7)], ['lte','periodo',M]]),
      fetchAll('producao', 'data, peso_produzido_kg, equipamento_id', [['gte','data',ini], ['lte','data',fimBusca]]),
      fetchAll('equipamentos', 'id, nome, frota, status, capacidade_kg_mes, capacidade_pct, observacao, observacao_dia'),
      fetchAll('materiais', 'nome, estoque_kg, valor_unitario, acondicionamento', [['eq','no_estoque',true]])
        .catch(() => fetchAll('materiais', 'nome, estoque_kg, valor_unitario', [['eq','no_estoque',true]])),
      fetchAll('colaboradores', '*'),
      fetchOpcional('cargos', 'preenchido, total_vagas'),
      fetchOpcional('equipamentos_snapshot', 'semana, equipamento_id, status', [['gte','semana',addDias(iniMes, -60)], ['lte','semana',fimBusca]]),
      fetchAll('tarefas', 'id, titulo, status, categoria, responsavel, data_vencimento, andamento')
        .catch(() => fetchOpcional('tarefas', 'id, titulo, status, categoria, responsavel, data_vencimento')),
      // Ponto de equilíbrio pelo resultado real (DRE); sem DRE, cai no estudo financeiro da tela Apresentação
      equilibrioDoDRE(supabase, M).catch(() => null),
    ]);
    const d = calcularDados({ vendas, metas, producao, equipamentos, materiais, colaboradores, cargos, snapshots }, M, corte, hoje);
    const est = finAtual(M);
    const fin = dre ? { pe:dre.pe, fixos:dre.fixos, liq:dre.liq, alvo:est.alvo, acerto:est.acerto, dre } : est;
    renderLembrete(colaboradores);
    render(d, tarefas, fin, materiais);
  } catch (e) {
    console.error(e);
    $('#db-conteudo').innerHTML = `<div class="card vazio">Não foi possível carregar os indicadores: ${esc(e.message)}</div>`;
  }
}

/* ═════════════ Lembrete de experiência ═════════════ */
function renderLembrete(colabs) {
  const diasAte = dt => Math.round((new Date(dt + 'T00:00:00') - new Date(hoje + 'T00:00:00')) / 86400000);
  const lista = [];
  colabs.filter(c => !c.demissao).forEach(c => {
    const per = [];
    if (c.fim_experiencia_1 && c.passou_exp_1 == null) per.push([1, c.fim_experiencia_1]);
    if (c.fim_experiencia_2 && c.passou_exp_2 == null && c.passou_exp_1 !== false) per.push([2, c.fim_experiencia_2]);
    per.forEach(([p, fim]) => { const dias = diasAte(fim); if (dias >= 0 && dias <= 7) lista.push({ nome:c.nome, p, fim, dias }); });
  });
  lista.sort((a, b) => a.dias - b.dias);
  const quando = n => n === 0 ? 'vence <b>hoje</b>' : n === 1 ? 'vence <b>amanhã</b>' : `vence em <b>${n} dias</b>`;
  $('#db-lembrete').innerHTML = !lista.length ? '' : `<div class="exp-lembrete">
    <div class="exp-lembrete-hd"><span class="exp-ic">⏰</span>Experiência vencendo <span class="exp-n">${lista.length}</span></div>
    <div class="exp-itens">${lista.map(x => `<a class="exp-item" href="rh.html" title="Avaliar no RH"><b>${esc(x.nome)}</b><span>${x.p}ª experiência ${quando(x.dias)} · ${ddmm(x.fim)}</span><em>Avaliar →</em></a>`).join('')}</div>
  </div>`;
}

/* ═════════════ Regras dos selos (iguais às do Resumo executivo da apresentação) ═════════════ */
const SEL = { ritmo:['NO RITMO','ok'], amb:['ATENÇÃO','amb'], abaixo:['ABAIXO','verm'], ok:['OK','ok'], verm:['CRÍTICO','verm'], nd:['SEM BASE','nd'] };
const noRitmo = p => p == null ? 'nd' : Math.round(p) >= 97 ? 'ritmo' : Math.round(p) >= 90 ? 'amb' : 'abaixo';
const corAt = p => p == null ? COR.cinza : Math.round(p) >= 97 ? COR.ok : Math.round(p) >= 90 ? COR.amb : COR.ruim;
const seta = v => v > 0 ? '▲' : '▼';
const varPct = (a, b) => a != null && b ? (a / b - 1) * 100 : null;
const pillVar = v => v == null ? '' : Math.abs(v) < 2 ? '<span class="sub">estável</span>' : `<span class="${v > 0 ? 'up' : 'down'}">${seta(v)} ${nf(Math.abs(v), 0)}%</span>`;
const nomeEq = e => e.frota ? `${e.nome} ${e.frota}` : e.nome;

/* ═════════════ Render ═════════════ */
function render(d, tarefas, fin, materiaisEst = []) {
  Object.values(charts).forEach(c => c.destroy()); charts = {};
  const fr = frasesPadrao(d, tarefas, fin);
  const eq = analiseEquilibrio(d, fin);
  const mes = nomeMes(d.M), c = d.cur;
  const atFat = d.meta > 0 ? c.fat / d.meta * 100 : null;
  const atProd = d.capMes > 0 ? d.prod / d.capMes * 100 : null;
  const espAqui = d.emAndamento && d.du > 0 && d.dp > 0 ? d.dp / d.du : 1;

  $('#db-sub').textContent = `UVR Indaiatuba · ${cap(mes)} de ${d.M.slice(0, 4)}`;
  const pctMes = d.du > 0 ? Math.min(100, d.dp / d.du * 100) : 100;
  $('#db-corte').innerHTML = `
    <div class="db-stats">
      <div class="db-stat"><span>${d.emAndamento ? 'Dia útil' : 'Dias úteis'}</span><b>${d.emAndamento ? `${d.dp}<small>/${d.du}</small>` : d.du}</b></div>
      <div class="db-stat"><span>${d.emAndamento ? 'Faltam' : 'Período'}</span><b>${d.emAndamento ? `${Math.max(0, d.du - d.dp)}<small> dias</small>` : `<small>${ddmm(d.ini)}–${ddmm(d.corte)}</small>`}</b></div>
      <div class="db-stat"><span>Dados até</span><b>${ddmm(d.corte)}</b></div>
    </div>
    <div class="db-corte-bar"><i style="width:${pctMes}%"></i></div>
    <div class="db-corte-sub"><span class="db-pill ${d.emAndamento ? 'and' : 'fech'}">${d.emAndamento ? '● Mês em andamento' : '✓ Mês fechado'}</span>${d.emAndamento ? `${nf(pctMes, 0)}% do mês já passou` : 'mês completo'}</div>`;

  /* ── Semáforos ── */
  const comEst = d.emAndamento && d.valorEstoque > 0;
  const fatEst = c.fat + (comEst ? d.valorEstoque : 0);
  const atFatEst = d.meta > 0 ? fatEst / d.meta * 100 : null;
  const atProdRef = d.emAndamento ? (d.esperado > 0 ? d.prod / d.esperado * 100 : null) : atProd;
  const ritmoR = d.dpPrensa > 0 ? d.prod / d.dpPrensa : 0;
  const lstEq = d.problemas.slice(0, 2).map(({ e, prev }) => `${esc(nomeEq(e))} (${e.st === 'restricao' ? 'restrição, ' : ''}${prev ? `volta ${ddmm(prev)}` : 'sem previsão'})`);
  const incompleta = d.colab != null && d.colab < d.quadro;
  const inds = [
    { alvo:'fat', rot:'Faturamento', st:noRitmo(atFatEst != null ? atFatEst / espAqui : null),
      val: mil(c.fat), ext: comEst ? `+ ${mil(d.valorEstoque)} em estoque` : '',
      sub: d.meta ? `${pct(comEst ? atFatEst : atFat, 0)} da meta de ${mil(d.meta)}${d.emAndamento ? ` · esperado ${pct(espAqui * 100, 0)}` : ''}` : 'sem meta cadastrada',
      barra: d.meta ? [ (comEst ? atFatEst : atFat), d.emAndamento ? espAqui * 100 : null ] : null,
      mot: d.meta ? (d.emAndamento ? `faltam <b>${mil(Math.max(0, d.meta * espAqui - fatEst))}</b> para o esperado até ${ddmm(d.corte)}` : `faltaram <b>${mil(Math.max(0, d.meta - c.fat))}</b> para a meta`) : '' },
    { alvo:'prensa', rot:'Prensagem', st:noRitmo(atProdRef), val:`${nf(d.prod / 1000, 1)} t produzidas`,
      sub: d.capMes > 0 ? `${pct(atProd, 0)} da capacidade do mês${d.emAndamento ? ` · esperado ${pct(d.esperado / d.capMes * 100, 0)}` : ''}` : 'sem capacidade cadastrada',
      barra: d.capMes > 0 ? [atProd, d.emAndamento ? d.esperado / d.capMes * 100 : null] : null,
      mot: d.capNominal > 0 && d.perdaCap / d.capNominal > 0.05 ? `<b>${esc(textoPerdaCap(d))}</b>` : d.dpPrensa > 0 ? `ritmo de <b>${nf(ritmoR / 1000, 1)} t/dia</b> · meta ${nf(d.metaDia / 1000, 1)} t/dia` : '' },
    { alvo:'equip', rot:'Equipamentos', st:d.eqSt, val:`${d.nOp + d.nRes} de ${d.eqs.length} disponíveis`,
      sub:`${d.disp != null ? `${pct(d.disp, 0)} disponíveis ${d.rotDisp}` : d.rotDisp}${d.dispMes != null ? ` · média do mês ${pct(d.dispMes, 0)}` : ''}`,
      barra: d.disp != null ? [d.disp, null] : null,

  /* ── Faturamento ── */
  const refPe = d.emAndamento ? d.projecao + d.valorEstoque + (fin.acerto || 0) : c.fat + (fin.acerto || 0);

  if (fin.pe > 0 && !d.inicioMes) cardsFat.push({ rot: refPe >= fin.pe ? 'Acima do ponto de equilíbrio' : 'Abaixo do ponto de equilíbrio', val:mil(Math.abs(refPe - fin.pe)),

  /* ── Composição de vendas ── */
  const a = d.antCheio, antAb = MES_AB[+d.Mant.slice(5) - 1];
  const ratioPG = c.g.prensado.preco && c.g.granel.preco ? c.g.prensado.preco / c.g.granel.preco : null;
  const cardsComp = [
    ['Ticket médio geral', c.preco ? `${reais0(c.preco)}/t` : '—', 'todos os materiais', `${antAb}: ${a.preco ? reais0(a.preco) + '/t' : '—'}`, varPct(c.preco, a.preco)],
    ['Preço do prensado', c.g.prensado.preco ? `${reais0(c.g.prensado.preco)}/t` : '—', ratioPG ? `vale ${nf(ratioPG, 1)}× o a granel` : '', `${antAb}: ${a.g.prensado.preco ? reais0(a.g.prensado.preco) + '/t' : '—'}`, varPct(c.g.prensado.preco, a.g.prensado.preco)],

    ['Saiu prensado', pct(c.pctPrensado, 0), 'do volume que pode ser prensado', `${antAb}: ${pct(a.pctPrensado, 0)}`, c.pctPrensado != null && a.pctPrensado != null ? c.pctPrensado - a.pctPrensado : null],
  ];
  // Venda por material: mês selecionado × média mensal dos meses fechados anteriores do ano
  const GRUPOS_K = ['prensado','granel','sucata','outros'];
  const porMat = r => { const o = {}; GRUPOS_K.forEach(g => Object.entries(r.g[g].mat).forEach(([n, v]) => {
    const m = (o[n] = o[n] || { fat:0, vol:0, g, gFat:0 }); m.fat += v.fat; m.vol += v.vol; if (v.fat > m.gFat) { m.g = g; m.gFat = v.fat; } })); return o; };
  const curMat = porMat(c);
  // Referência dos materiais: outubro/2026 (mês escolhido como meta de volume e valor).
  // Para meses até outubro, continua a média dos meses anteriores do ano.
  const MES_REF_MAT = '2026-10';
  const mesesAnt = d.mesesAno.map((mk, i) => ({ mk, r:d.fatMes[i] })).filter(x => x.mk < d.M);
  const refFixo = mesesAnt.some(x => x.mk === MES_REF_MAT);
  const mesesBase = refFixo ? mesesAnt.filter(x => x.mk === MES_REF_MAT) : mesesAnt;
  const nBase = mesesBase.length;
  const somaBase = {};
  mesesBase.forEach(x => Object.entries(porMat(x.r)).forEach(([n, v]) => { const b = (somaBase[n] = somaBase[n] || { fat:0, vol:0, g:v.g }); b.fat += v.fat; b.vol += v.vol; }));
  const fracEsp = d.emAndamento ? espAqui : 1;   // mês em andamento: esperado = média × dias úteis já passados
  // Estoque atual por material (tela Estoque): só faz sentido no mês em andamento (é a foto de hoje)
  const estPor = {};
  if (d.emAndamento) materiaisEst.forEach(m => { const kg = parseFloat(m.estoque_kg || 0); if (kg > 0) estPor[m.nome] = { kg, val:kg * parseFloat(m.valor_unitario || 0) }; });
  // Todos os materiais já comercializados no ano (até o mês selecionado), vendidos ou não neste mês
  const mats = [...new Set([...Object.keys(curMat), ...Object.keys(somaBase)])].map(n => {
    const cu = curMat[n] || { fat:0, vol:0 }, b = somaBase[n];
    const media = b && nBase ? b.fat / nBase : null, mediaVol = b && nBase ? b.vol / nBase : null;

  }).sort((x, y) => (y.media || 0) - (x.media || 0) || y.fat - x.fat);
  const fatMx = Math.max(1, ...mats.map(m => Math.max(m.fat, m.media || 0)));
  const T = mats.reduce((t, m) => { ['fat','vol','media','mediaVol','ref','refVol','falta','faltaVol','estKg','estVal'].forEach(k => t[k] += m[k] || 0); return t; },

    </div>

      ${d.emAndamento ? '<span><i class="e"></i>esperado até hoje</span>' : ''}
      <span>▲ ▼ ritmo contra ${d.emAndamento ? 'o esperado' : refFixo ? 'outubro' : 'a média'}</span>

    </div>
    ${naoV.length ? `<p class="sub" style="margin-top:10px;font-size:12.5px"><b>${naoV.length} ${naoV.length > 1 ? `materiais vendidos ${refFixo ? 'em outubro' : 'no ano'} ainda não saíram` : `material vendido ${refFixo ? 'em outubro' : 'no ano'} ainda não saiu`} neste mês</b> (${refFixo ? `${mil(naoVMedia)} em outubro` : `média de ${mil(naoVMedia)}/mês`}): ${naoV.slice(0, 6).map(m => esc(nomeMat(m.n))).join(', ')}${naoV.length > 6 ? ` e mais ${naoV.length - 6}` : ''}.</p>` : ''}`;

  /* ── Prensagem ── */
  const atEsp = d.esperado > 0 ? d.prod / d.esperado * 100 : null;
  const pProj = d.capMes > 0 ? d.projProd / d.capMes * 100 : null;
  const tCap = kg => nf(kg / 1000, d.perdaCap > 0.5 ? 1 : 0);
  const cardsPrensa = [
    { rot: d.emAndamento ? `Produzido até ${ddmm(d.corte)}` : `Produzido em ${mes}`, val:tn(d.prod, 1), dest:true,
      selo: noRitmo(d.emAndamento ? atEsp : atProd), sub: d.emAndamento ? `${pct(atEsp, 0)} do previsto até aqui (${tn(d.esperado, 1)})` : `${pct(atProd, 0)} da capacidade de ${tCap(d.capMes)} t` },
    d.emAndamento && !d.inicioMes
      ? { rot:'No ritmo atual, fecha em', val:`~${nf(d.projProd / 1000, 0)} t`, sub:`${pct(pProj, 0)} da capacidade de ${tCap(d.capMes)} t` }
      : { rot:'Capacidade do mês', val:`${tCap(d.capMes)} t`, sub:`${d.prensas.length} prensas${d.perdaCap > 0.5 ? ` (−${nf(d.perdaCap / 1000, 1)} t manutenção)` : ''}` },
    { rot:'Ritmo por dia útil', val:`${nf(ritmoR / 1000, 1)} t/dia`, cls: ritmoR >= d.metaDia ? 'up' : '', sub:`meta: ${nf(d.metaDia / 1000, 1)} t/dia` },
  ];
  // Cada prensa num cartão pequeno: % do previsto em destaque, barra e toneladas
  const porPrensaHTML = d.porPrensa.length ? `<div class="db-mini-t">Cada prensa × previsto ${d.emAndamento ? `até ${ddmm(d.corte)}` : 'no mês'}</div>
    <div class="pr-grid">` + d.porPrensa.map(x => `<div class="pr-card">
      <div class="pr-hd"><b>${esc(x.e.frota || x.e.nome)}</b><span class="pr-pct" style="color:${corAt(x.pct)}">${pct(x.pct, 0)}</span></div>
      <div class="mt-barra"><i style="width:${Math.min(100, x.pct || 0)}%;background:${corAt(x.pct)}"></i></div>
      <div class="pr-sub">${nf(x.prod / 1000, 1)} de ${nf(x.prev / 1000, 1)} t${x.diasParado ? ` · <span class="down">parada ${x.diasParado} dia${x.diasParado > 1 ? 's' : ''}</span>` : ''}</div>
    </div>`).join('') + '</div>' : '';

  /* ── Equipamentos e equipe ── */
  const corDisp = v => v == null ? '' : v >= 99.5 ? 'up' : v >= 90 ? 'amb-t' : 'down';
  const kEq = [
    [`Disponíveis ${d.rotDisp}`, `${d.nOp + d.nRes} de ${d.eqs.length}`, { verm:'down', amb:'amb-t', ok:'up' }[d.eqSt] || '', [d.nPar ? `${d.nPar} parado${d.nPar > 1 ? 's' : ''}` : '', d.nRes ? `${d.nRes} com restrição` : ''].filter(Boolean).join(' · ') || 'todos operando'],
    ['Média do mês', d.dispMes != null ? pct(d.dispMes, 0) : '—', corDisp(d.dispMes), 'da frota disponível nos dias registrados'],
    ['Equipe', d.colab != null ? `${d.colab} de ${d.quadro}` : '—', d.colab == null ? '' : incompleta ? 'amb-t' : 'up', d.colab != null ? `${nf(d.colab / d.quadro * 100, 0)}% do quadro previsto` : 'sem colaboradores no RH'],
    ['Vagas em aberto', d.vagas != null ? String(d.vagas) : '—', d.vagas ? 'amb-t' : 'up', d.vagas ? 'em reposição' : 'quadro completo'],
  ];
  // Equipamentos com problema: lista compacta (nome + situação, problema, datas numa linha só)
  const probHTML = d.problemas.length ? '<div class="pb-lista">' + d.problemas.map(({ e, prob, desde, prev, pctPar, diasPar }) => {
      const parado = e.st === 'parado';
      const volta = prev ? `<b class="${prev < hoje ? 'down' : ''}">${ddmm(prev)}${prev < hoje ? ' (vencida)' : ''}</b>` : 'a definir';
      return `<div class="pb-item ${parado ? 'par' : 'res'}">
        <div class="pb-hd"><b>${esc(e.nome)}</b><span class="pb-st">${parado ? 'Parado' : `Com restrição${e.capacidade_pct ? ` · ${e.capacidade_pct}%` : ''}`}</span></div>
        <div class="pb-prob">${prob ? esc(prob) : '<i>sem observação</i>'}</div>
        <div class="pb-meta">${esc(e.frota || '')}${desde ? ` · desde ${ddmm(desde)}` : ''} · volta: ${volta}${pctPar > 0 ? ` · <span class="down">parado ${nf(pctPar, 0)}% do mês${diasPar ? ` (${diasPar} dia${diasPar > 1 ? 's' : ''})` : ''}</span>` : ''}</div>
      </div>`; }).join('') + '</div>'
    : `<div class="pb-ok">✓ Todos os equipamentos operando ${d.rotDisp}.</div>`;
  const voltaram = d.comParada.filter(x => x.e.st === 'operando');

  /* ── Rumo ao equilíbrio ── */
  let equilHTML = '';
  if (eq) {
    const { base, antes, depois } = eq, eb = eq.ebitda(base.rec), mg = eq.margem(base.rec);
    const vRec = antes?.rec > 0 && depois ? (depois.rec / antes.rec - 1) * 100 : null;
    const cardsEq = [
      depois ? { rot:'Receita média depois do plano', val:`${mil(depois.rec)}/mês`, dest:true, sub: antes ? `antes: ${mil(antes.rec)}/mês${vRec != null ? ` (${seta(vRec)} ${nf(Math.abs(vRec), 0)}%)` : ''}` : '' } : null,
      base.rec > 0 ? { rot: base.rec >= eq.pe ? 'Acima do equilíbrio' : 'Falta para o equilíbrio', val:mil(Math.abs(base.rec - eq.pe)), cls: base.rec >= eq.pe ? 'up' : 'down', sub:`${esc(base.rot)}: ${mil(base.rec)} · equilíbrio ${mil(eq.pe)}/mês` } : null,
      base.rec > 0 ? { rot:'EBITDA estimado/mês', val:`${eb < 0 ? '−' : ''}${mil(Math.abs(eb))}`, cls: eb >= 0 ? 'up' : 'down', sub: mg != null ? `margem de ${nf(mg, 1)}%` : '' } : null,
    ].filter(Boolean);
    const cen = eq.cenarios.map(x => `<tr><td><b>${esc(x.rot)}</b></td><td class="n">${mil(x.rec)}/mês</td>
      <td class="n">${x.volNec ? tn(x.volNec, 0) : '—'}<br><span class="sub" style="font-size:11px">${base.vol ? `hoje: ${tn(base.vol, 0)}` : ''}</span></td>
      <td class="n">${x.ticketNec ? reais0(x.ticketNec) + '/t' : '—'}<br><span class="sub" style="font-size:11px">${base.ticket ? `hoje: ${reais0(base.ticket)}/t` : ''}</span></td></tr>`).join('');
    equilHTML = `<section class="db-sec" id="s-equil">
      <div class="db-sec-hd"><h2>Rumo ao equilíbrio</h2>${fin.dre ? '<a href="dre.html">Ver no DRE →</a>' : '<a href="apresentacao.html">Ajustar o estudo financeiro →</a>'}</div>
      <p class="db-frase">${fraseHTML(fr.equil)}</p>
      <p class="sub" style="margin:-8px 0 16px;font-size:12.5px">${fin.dre
        ? `Ponto de equilíbrio calculado pelo <b>resultado real do DRE</b> (${fin.dre.periodo}): gastos fixos de ${mil(fin.dre.fixos)}/mês ÷ margem de contribuição de ${pct(fin.dre.mc * 100, 1)}. No período, o EBITDA real foi de ${mil(fin.dre.ebitdaMes)}/mês.`
        : 'Sem dados no DRE: usando o estudo financeiro da tela Apresentação.'}</p>
      <div class="db-corpo">
        <div><div class="chart-wrap"><canvas id="c-equil"></canvas></div>
          <div class="db-mini-t" style="margin-top:16px">O que é preciso para cada objetivo (uma alavanca de cada vez)</div>
          <div class="table-scroll"><table class="db"><thead><tr><th>Objetivo</th><th style="text-align:right">Receita</th><th style="text-align:right">Volume no ticket atual</th><th style="text-align:right">Ticket no volume atual</th></tr></thead><tbody>${cen}</tbody></table></div>
        </div>
        <div class="db-cards">${cardsEq.map(cardHTML).join('')}</div>
      </div>
    </section>`;
  }

  /* ── Plano de ação ── */
  const cats = [...new Set(tarefas.map(t => t.categoria).filter(Boolean))];
  const catSalva = lsGet('sgr_apres_cat');
  const cat = catSalva != null && (catSalva === '' || cats.includes(catSalva)) ? catSalva : (cats.find(x => /plano|comit/i.test(x)) || '');
  const acoes = tarefas.filter(t => t.status !== 'cancelada' && (!cat || t.categoria === cat));
  const atrasada = t => t.data_vencimento && t.data_vencimento < hoje && t.status !== 'concluida';
  const ordemSt = t => atrasada(t) ? 0 : t.status === 'em_andamento' ? 1 : t.status === 'pendente' ? 2 : 3;
  acoes.sort((x, y) => ordemSt(x) - ordemSt(y) || (x.data_vencimento || '9999').localeCompare(y.data_vencimento || '9999'));
  const nAtr = acoes.filter(atrasada).length, nAnd = acoes.filter(t => t.status === 'em_andamento').length, nOk = acoes.filter(t => t.status === 'concluida').length;
  const stPill = t => { const s = atrasada(t) ? ['Atrasada','#fee2e2','#991b1b'] : t.status === 'em_andamento' ? ['Em andamento','#fef3c7','#92400e'] : t.status === 'concluida' ? ['Concluída','#dcfce7','#166534'] : [STATUS_TAREFA[t.status] || t.status || '—','#f1f5f9','#475569'];
    return `<span class="st-pill" style="background:${s[1]};color:${s[2]}">${esc(s[0])}</span>`; };
  const abertas = acoes.filter(t => t.status !== 'concluida');
  const planoHTML = `<section class="db-sec" id="s-plano">
    <div class="db-sec-hd"><h2>Plano de ação</h2><a href="tarefas.html">Abrir Tarefas →</a></div>
    <p class="db-frase">${acoes.length ? `${acoes.length} ações${cat ? ` em <b>${esc(cat)}</b>` : ''}: <span class="ok">${nOk} concluída${nOk === 1 ? '' : 's'}</span>, ${nAnd} em andamento${nAtr ? `, <span class="ruim">${nAtr} atrasada${nAtr > 1 ? 's' : ''}</span>` : ''}.${nAtr ? ' Comece pelas atrasadas: motivo e nova data.' : ''}` : 'Nenhuma ação cadastrada. Cadastre as ações do comitê em Tarefas.'}</p>
    ${abertas.length ? `<div class="table-scroll"><table class="db"><thead><tr><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody>` +
      abertas.slice(0, 10).map(t => `<tr><td><b>${esc(t.titulo)}</b>${t.andamento ? `<br><span class="sub" style="font-size:12px">${esc(t.andamento)}</span>` : ''}</td>
        <td>${esc(t.responsavel || 'a definir')}</td><td class="${atrasada(t) ? 'down' : ''}">${t.data_vencimento ? ddmmaaaa(t.data_vencimento) : 'a definir'}</td><td>${stPill(t)}</td></tr>`).join('') +
      `</tbody></table></div>${abertas.length > 10 ? `<p class="sub" style="margin-top:8px">e mais ${abertas.length - 10} em Tarefas.</p>` : ''}` : ''}
  </section>`;

  /* ══ 1. Vamos bater a meta do mês? ══ */
  const estM = d.emAndamento ? d.valorEstoque : 0;
  // o estoque pronto para vender já conta como vendido: o que falta é meta − faturado − estoque
  const garantido = c.fat + estM;
  const faltaMeta = d.meta > 0 ? Math.max(0, d.meta - garantido) : null;
  let cardsMeta;
  if (!d.emAndamento || !d.meta) {
    cardsMeta = cardsFat.filter(Boolean).filter(k => !/equilíbrio/i.test(k.rot)).slice(0, 3);
  } else {
    const pG = garantido / d.meta * 100;
    const batida = faltaMeta <= 0;
    // barra: faturado | estoque pronto | o que resta (fundo)
    const w = v => Math.max(0, Math.min(100, v / d.meta * 100));
    const barraMeta = `<div class="mt-barra"><i class="f" style="width:${w(c.fat)}%"></i>${estM ? `<i class="e" style="left:${w(c.fat)}%;width:${w(garantido) - w(c.fat)}%"></i>` : ''}</div>
`;
    // um card só: meta, barra e as três parcelas (faturado + estoque + falta = meta)
    const linha = (cls, rot, v, extra = '') => `<div class="mt-ln ${extra}"><span><i class="${cls}"></i>${rot}</span><b>${mil(v)}</b><em>${pct(v / d.meta * 100, 0)}</em></div>`;
    const linhas = `<div class="mt-lns">
        ${linha('f', `Faturado até ${ddmm(d.corte)}`, c.fat)}
        ${estM ? linha('e', 'Em estoque (pronto para vender)', estM) : ''}
        ${batida ? `<div class="mt-ln tot"><span>A meta está ${c.fat >= d.meta ? 'batida' : 'garantida com o estoque'}</span></div>`
          : linha('', estM ? 'Falta (somando faturado + estoque)' : 'Falta para a meta', faltaMeta, 'tot')}
      </div>`;
    cardsMeta = [
      { rot:'Meta do mês', val:mil(d.meta), dest:true, selo: batida ? 'ritmo' : noRitmo(pG / espAqui), extra: barraMeta + linhas },
    ];
  }

  /* ══ 2. A operação está entregando? ══ */
  const faltaCap = Math.max(0, d.capMes - d.prod);
  // Card principal no mesmo formato da meta: capacidade, barra (produzido + marca do previsto) e as parcelas
  let cardCap = null;
  if (d.capMes > 0) {
    const wC = v => Math.max(0, Math.min(100, v / d.capMes * 100));
    const lnC = (cls, rot, kg, extra = '') => `<div class="mt-ln ${extra}"><span>${cls != null ? `<i class="${cls}"></i>` : ''}${rot}</span><b>${nf(kg / 1000, 1)} t</b><em>${pct(kg / d.capMes * 100, 0)}</em></div>`;
    const barraC = `<div class="mt-barra"><i class="f" style="width:${wC(d.prod)}%"></i>${d.emAndamento ? `<span class="mk" style="left:${wC(d.esperado)}%"></span>` : ''}</div>`;
    const linhasC = `<div class="mt-lns">
        ${lnC('f', d.emAndamento ? `Produzido até ${ddmm(d.corte)}` : `Produzido em ${mes}`, d.prod)}
        ${d.emAndamento ? lnC('m', 'Previsto até hoje', d.esperado) : ''}
        ${faltaCap > 0 ? lnC(null, d.emAndamento ? 'Falta para a capacidade' : 'Ficou abaixo da capacidade', faltaCap, 'tot') : '<div class="mt-ln tot"><span>Capacidade do mês atingida</span></div>'}
      </div>`;
    cardCap = { rot:'Capacidade do mês', val:`${tCap(d.capMes)} t`, dest:true, selo: noRitmo(d.emAndamento ? atEsp : atProd),
      sub: d.perdaCap > 0.5 ? `já descontados ${nf(d.perdaCap / 1000, 1)} t de manutenção` : '', extra: barraC + linhasC };
  }
  const cardsOper = [
    cardCap || cardsPrensa[0],
    { rot:'Equipe', val: d.colab != null ? `${d.colab} de ${d.quadro}` : '—', cls: d.colab == null ? '' : incompleta ? 'amb-t' : 'up', sub: d.vagas ? `${d.vagas} vaga${d.vagas > 1 ? 's' : ''} em reposição` : 'quadro completo' },
  ];

  /* ══ 3. Estamos dando lucro? ══ */
  let lucroHTML = '';
  if (eq && eq.base.rec > 0) {
    const { base } = eq, eb = eq.ebitda(base.rec), mg = eq.margem(base.rec);
    const marcas = [
      ['Ponto de equilíbrio', eq.pe, COR.ruim],
      ...(d.meta > 0 ? [['Meta do mês', d.meta, COR.s2]] : []),
      ...(eq.rAlvo ? [[`Margem EBITDA de ${nf(eq.alvo, 0)}%`, eq.rAlvo, COR.s1]] : []),
    ];
    const esc_ = Math.max(base.rec, ...marcas.map(m => m[1])) * 1.1;
    const posR = v => Math.min(100, v / esc_ * 100);
    const dif = base.rec - eq.pe;
    lucroHTML = `<section class="db-sec" id="b-lucro">
      <div class="db-sec-hd"><div><span class="db-q-n">3</span><h2 class="db-q">Estamos dando lucro?</h2></div>${fin.dre ? '<a href="dre.html">Ver no DRE →</a>' : ''}</div>
      <p class="db-frase">${esc(base.rot)}: <b>${mil(base.rec)}</b>, ${dif >= 0 ? `<span class="ok">${mil(dif)} acima do ponto de equilíbrio</span>` : `<span class="ruim">${mil(-dif)} abaixo do ponto de equilíbrio</span>`} (${mil(eq.pe)}/mês${fin.dre ? `, calculado pelo DRE de ${fin.dre.periodo}` : ''}). EBITDA estimado de ${eb >= 0 ? `<span class="ok">${mil(eb)}</span>` : `<span class="ruim">−${mil(-eb)}</span>`} no mês${mg != null ? ` (margem de ${nf(mg, 1)}%)` : ''}.</p>
      <div class="db-corpo">
        <div>
          <div class="regua"><i style="width:${posR(base.rec)}%;background:${dif >= 0 ? COR.ok : COR.s2}"></i>
            ${marcas.map(([n, v, cor]) => `<span class="mk" style="left:${posR(v)}%;background:${cor}" title="${n}: ${mil(v)}"></span>`).join('')}</div>
          <div class="leg" style="margin-top:10px">
            <span style="--c:${dif >= 0 ? COR.ok : COR.s2}">${esc(base.rot)}: <b>${mil(base.rec)}</b></span>
            ${marcas.map(([n, v, cor]) => `<span style="--c:${cor}">${n}: <b>${mil(v)}</b></span>`).join('')}
          </div>
        </div>
        <div class="db-cards">
          ${cardHTML({ rot:'EBITDA estimado do mês', val:`${eb < 0 ? '−' : ''}${mil(Math.abs(eb))}`, cls: eb >= 0 ? 'up' : 'down', dest: eb >= 0, sub: mg != null ? `margem de ${nf(mg, 1)}% sobre a receita líquida` : '' })}
          ${fin.dre ? cardHTML({ rot:`EBITDA real (DRE ${fin.dre.periodo})`, val:`${fin.dre.ebitdaMes < 0 ? '−' : ''}${mil(Math.abs(fin.dre.ebitdaMes))}/mês`, cls: fin.dre.ebitdaMes >= 0 ? 'up' : 'down', sub:'média dos meses fechados no DRE' }) : ''}
        </div>
      </div>
    </section>`;
  }

  /* ══ Detalhe comercial (recolhido) ══ */
  const cenHTML = eq ? `<div class="db-mini-t" style="margin-top:18px">O que é preciso para cada objetivo (uma alavanca de cada vez)</div>
    <div class="table-scroll"><table class="db"><thead><tr><th>Objetivo</th><th style="text-align:right">Receita</th><th style="text-align:right">Volume no ticket atual</th><th style="text-align:right">Ticket no volume atual</th></tr></thead><tbody>
    ${eq.cenarios.map(x => `<tr><td><b>${esc(x.rot)}</b></td><td class="n">${mil(x.rec)}/mês</td>
      <td class="n">${x.volNec ? tn(x.volNec, 0) : '—'}<br><span class="sub" style="font-size:11px">${eq.base.vol ? `hoje: ${tn(eq.base.vol, 0)}` : ''}</span></td>
      <td class="n">${x.ticketNec ? reais0(x.ticketNec) + '/t' : '—'}<br><span class="sub" style="font-size:11px">${eq.base.ticket ? `hoje: ${reais0(eq.base.ticket)}/t` : ''}</span></td></tr>`).join('')}
    </tbody></table></div>` : '';

  const plano4 = planoHTML.replace('id="s-plano"', 'id="b-plano"')
    .replace('<h2>Plano de ação</h2>', '<div><span class="db-q-n">4</span><h2 class="db-q">O que estamos fazendo?</h2></div>');

  /* ── Resumo didático: quanto do mês já passou × quanto já foi feito ── */
  const espFat = d.emAndamento ? espAqui * 100 : 100;
  const espProd = d.emAndamento ? (d.capMes > 0 ? d.esperado / d.capMes * 100 : null) : 100;
  const pFat = atFat, pFatEst = comEst ? atFatEst : null, pProd = atProd;
  const stRot = d.emAndamento
    ? { ritmo:['No ritmo','ok'], amb:['Um pouco abaixo','amb'], abaixo:['Abaixo do ritmo','verm'], nd:['Sem base','nd'] }
    : { ritmo:['Atingido','ok'], amb:['Quase lá','amb'], abaixo:['Abaixo','verm'], nd:['Sem base','nd'] };
  // Uma barra por indicador, com os números escritos dentro dela:
  // trecho branco = feito até hoje · trecho claro = estoque pronto · marca amarela = onde deveria estar hoje · fim = meta/capacidade
  const linhaResumo = (nome, st, p, pEst, esp, rot) => {
    const [txtSt, cl] = stRot[st] || stRot.nd;
    const w = v => Math.max(0, Math.min(100, v || 0));
    const pE = pEst != null && pEst > p ? pEst : null;
    const dentroFeito = w(p) >= 24, dentroEst = pE != null && w(pE) - w(p) >= 22;
    return `<div class="mc-linha">
      <div class="mc-nome">${nome}<span class="mc-st ${cl}">${txtSt}</span></div>
      <div class="mc-barra">
        ${pE != null ? `<i class="est" style="left:${w(p)}%;width:${w(pE) - w(p)}%">${dentroEst ? `<span>+ ${rot.est} = ${pct(pE, 0)}</span>` : ''}</i>` : ''}
        <i class="feito" style="width:${w(p)}%">${dentroFeito ? `<span>${rot.feito} · ${pct(p, 0)}</span>` : ''}</i>
        ${!dentroFeito ? `<span class="fora" style="left:calc(${w(pE ?? p)}% + 8px)">${rot.feito} · ${pct(p, 0)}${pE != null ? ` (+ ${rot.est} = ${pct(pE, 0)})` : ''}</span>` : ''}
        ${dentroFeito && pE != null && !dentroEst ? `<span class="fora" style="left:calc(${w(pE)}% + 8px)">+ ${rot.est} = ${pct(pE, 0)}</span>` : ''}
        ${esp != null && d.emAndamento ? `<span class="mc-esp" style="left:${w(esp)}%"><em>hoje deveria estar em ${rot.esp} (${pct(esp, 0)})</em></span>` : ''}
        <span class="mc-fim">${rot.fim}</span>
      </div>
    </div>`;
  };
  const resumoHTML = `<div class="db-manchete">
      <div class="tag">Resumo · ${cap(mes)} ${d.M.slice(0, 4)}${d.emAndamento ? ` · dados até ${ddmm(d.corte)}` : ' · mês fechado'}</div>
      <h1>${d.emAndamento ? `Já passaram <b>${d.dp} de ${d.du} dias úteis</b> do mês (${pct(espFat, 0)}).` : `${cap(mes)} terminou.`}</h1>
      <div class="mc-linhas">
        ${d.meta > 0 ? linhaResumo('Faturamento', inds[0].st, pFat, pFatEst, espFat,
            { feito:mil(c.fat), est:`${mil(d.valorEstoque)} em estoque`, esp:mil(d.meta * espFat / 100), fim:`meta ${mil(d.meta)}` }) : ''}
        ${d.capMes > 0 ? linhaResumo('Prensagem', inds[1].st, pProd, null, espProd,
            { feito:`${nf(d.prod / 1000, 1)} t`, est:'', esp:`${nf(d.esperado / 1000, 1)} t`, fim:`capacidade ${tCap(d.capMes)} t` }) : ''}
      </div>
      ${d.emAndamento ? '<div class="mc-leg"><span><i class="f"></i>feito até hoje</span>' + (pFatEst != null ? '<span><i class="e"></i>estoque pronto para vender</span>' : '') + '<span><i class="m"></i>onde deveria estar hoje</span></div>' : ''}
    </div>`;

  /* ── Montagem ── */
  // Tela inicial: só os 4 cards; cada um abre uma janela com os gráficos e detalhes dele
  const cardEq = ([rot, val, cls, sub]) => cardHTML({ rot, val, cls, sub });
  const painel = (id, titulo, links, corpo) => `<div class="db-painel" data-painel="${id}" hidden>
      <div class="db-modal-hd"><h2>${titulo}</h2><span class="db-modal-links">${links}</span></div>${corpo}</div>`;
  $('#db-conteudo').innerHTML = `
    <div class="db-home">
      <div class="db-home-hd"><h2>Resumo de ${mes} de ${d.M.slice(0, 4)}</h2><p>Clique num card para ver os gráficos e os detalhes.</p></div>
      <div class="db-sem">${semHTML}</div>
    </div>

    <div class="db-modal" id="db-modal" hidden>
      <div class="db-modal-fundo" data-fechar></div>
      <div class="db-modal-caixa" role="dialog" aria-modal="true">
        <button type="button" class="db-modal-x" data-fechar title="Fechar (Esc)">×</button>

        ${painel('fat', 'Faturamento', '<a href="comercial.html">Ver vendas →</a>', `
        <section class="db-sec" id="b-meta">
          <div class="db-sec-hd"><h2 class="db-q">Vamos bater a meta do mês?</h2></div>
          <div class="db-corpo" style="margin-top:14px">
            <div><div class="chart-wrap" style="height:260px"><canvas id="c-fat"></canvas></div></div>
            <div class="db-cards">${cardsMeta.map(cardHTML).join('')}</div>
          </div>
          <div class="db-mini-t" style="margin-top:18px">De onde vem o faturamento: ${refFixo ? 'cada material × outubro (referência)' : `cada material × a média dele${rotBase ? ` (${rotBase})` : ''}`}</div>
          ${matsHTML}
        </section>
        ${lucroHTML}`)}

        ${painel('prensa', 'Prensagem', '<a href="producao.html">Produção →</a>', `
        <section class="db-sec" id="b-oper">
          <div class="db-corpo">
            <div><div class="chart-wrap" style="height:260px"><canvas id="c-prensa"></canvas></div></div>
            <div class="db-cards">${cardHTML(cardsOper[0])}</div>
          </div>
          <div style="margin-top:18px">${porPrensaHTML}</div>
        </section>`)}

        ${painel('equip', 'Equipamentos', '<a href="equipamentos.html">Equipamentos →</a>', `
        <section class="db-sec">
          <div class="db-grid2">${kEq.slice(0, 2).map(cardEq).join('')}</div>
          <div class="db-mini-t" style="margin-top:18px">Equipamentos com problema</div>
          ${probHTML}
          ${voltaram.length ? `<p class="sub" style="margin-top:8px;font-size:12px">Pararam no mês e já voltaram: ${voltaram.map(x => `${esc(nomeEq(x.e))} (${x.dias} dia${x.dias > 1 ? 's' : ''})`).join(' · ')}.</p>` : ''}
        </section>`)}

        ${painel('equipe', 'Equipe', '<a href="rh.html">RH →</a><a href="tarefas.html">Tarefas →</a>', `
        <section class="db-sec">
          <div class="db-grid2">${kEq.slice(2, 4).map(cardEq).join('')}</div>
        </section>
        ${plano4}`)}

        <p class="sub" style="text-align:center;margin:4px 0 8px">Precisa do balanço de entradas, dos clientes ou das avaliações da equipe? <a href="dashboard-detalhado.html" style="color:var(--primary);font-weight:600">Abrir o relatório detalhado →</a></p>
      </div>
    </div>
  `;

  const modal = $('#db-modal');
  const abrir = id => {
    modal.querySelectorAll('.db-painel').forEach(p => { p.hidden = p.dataset.painel !== id; });
    modal.hidden = false; document.body.classList.add('db-modal-aberto');
    modal.querySelector('.db-modal-caixa').scrollTop = 0;
    Object.values(charts).forEach(ch => ch?.resize?.());
  };
  const fechar = () => { modal.hidden = true; document.body.classList.remove('db-modal-aberto'); };
  document.querySelectorAll('.db-ind').forEach(b => b.onclick = () => abrir(b.dataset.alvo));
  modal.querySelectorAll('[data-fechar]').forEach(x => x.onclick = fechar);
  document.onkeydown = e => { if (e.key === 'Escape' && !modal.hidden) fechar(); };
  graficos(d, eq);
}

function cardHTML(k) {
  if (!k) return '';
  const s = k.selo ? SEL[k.selo] : null;
  return `<div class="db-card ${k.dest ? 'dest' : ''}"><div class="rot"><span>${k.rot}</span>${s ? `<span class="selo ${s[1]}">${s[0]}</span>` : ''}</div>
    <div class="val ${k.cls || ''}">${k.val}</div><div class="sub">${k.sub || ''}</div>${k.extra || ''}</div>`;
}

/* ═════════════ Gráficos ═════════════ */
function opts(fmt, legenda = true) {
  return { responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ display:legenda, position:'top', align:'start', labels:{ color:COR.txt, boxWidth:10, boxHeight:10, usePointStyle:true } },
              tooltip:{ callbacks:{ label:x => `${x.dataset.label}: ${fmt(x.parsed.y)}` } } },
    scales:{ x:{ grid:{ display:false }, ticks:{ color:COR.txt } }, y:{ beginAtZero:true, grid:{ color:COR.grid }, border:{ display:false }, ticks:{ color:COR.txt, callback:v => fmt(v) } } } };
}
const k$ = v => `R$ ${nf(v / 1000, 0)} mil`;
function graficos(d, eq) {
  if (!window.Chart) return;
  const labels = d.mesesAno.map(mk => MES_AB[+mk.slice(5) - 1]);
  const parcial = mk => mk === d.M && d.emAndamento;
  const bar = { borderRadius:4, borderSkipped:'start', maxBarThickness:34 };
  const linha = { type:'line', borderWidth:2, pointRadius:0, pointHoverRadius:4, borderDash:[6, 4], tension:0 };

  // mês corrente: o estoque pronto para vender entra empilhado sobre o faturado
  const temEst = d.emAndamento && d.valorEstoque > 0;
  const optFat = opts(k$);
  if (temEst) { optFat.scales.x.stacked = true; optFat.scales.y.stacked = true; }
  charts.fat = new Chart(document.getElementById('c-fat'), { type:'bar', data:{ labels, datasets:[
    { label:'Faturamento', data:d.fatMes.map(r => r.fat), backgroundColor:d.mesesAno.map(mk => parcial(mk) && !temEst ? COR.verdeCl : COR.verde), stack:'f', ...bar,
      borderRadius:x => temEst && d.mesesAno[x.dataIndex] === d.M ? 0 : 4 },
    ...(temEst ? [{ label:'Estoque pronto', data:d.mesesAno.map(mk => mk === d.M ? d.valorEstoque : null), backgroundColor:'#86c5a0', stack:'f', ...bar, borderSkipped:false }] : []),
    { label:'Meta', data:d.mesesAno.map(mk => (d.metaMes[mk] ?? d.meta) || null), borderColor:COR.s2, backgroundColor:COR.s2, stack:'meta', ...linha },
  ] }, options:optFat });

  charts.prensa = new Chart(document.getElementById('c-prensa'), { type:'bar', data:{ labels, datasets:[
    { label:'Produção das prensas', data:d.prodMesAno.map(v => v / 1000), backgroundColor:d.mesesAno.map(mk => parcial(mk) ? COR.verdeCl : COR.verde), ...bar },
    { label:'Capacidade', data:d.capMesAno.map(v => v / 1000), borderColor:COR.s1, backgroundColor:COR.s1, ...linha },
  ] }, options:opts(v => `${nf(v, 0)} t`) });

  if (eq && document.getElementById('c-equil')) {
    const rec = d.mesesAno.map((mk, i) => d.fatMes[i].fat + (mk === d.M ? eq.acerto : 0));
    charts.equil = new Chart(document.getElementById('c-equil'), { type:'bar', data:{ labels, datasets:[
      { label:'Receita do mês', data:rec, backgroundColor:d.mesesAno.map((mk, i) => parcial(mk) ? COR.verdeCl : rec[i] >= eq.pe ? COR.ok : COR.s2), ...bar },
      { label:`Ponto de equilíbrio (${mil(eq.pe)})`, data:labels.map(() => eq.pe), borderColor:COR.ruim, backgroundColor:COR.ruim, ...linha },
      ...(eq.rAlvo ? [{ label:`Margem EBITDA de ${nf(eq.alvo, 0)}%`, data:labels.map(() => eq.rAlvo), borderColor:COR.s1, backgroundColor:COR.s1, ...linha }] : []),
    ] }, options:opts(k$) });
  }
}

/* ═════════════ Dica (tooltip) das barras de materiais ═════════════ */
const tip = document.createElement('div'); tip.id = 'db-tip'; document.body.appendChild(tip);
const posTip = (x, y) => {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 12, x + 14) + 'px';
  tip.style.top = (y + h + 20 > window.innerHeight ? y - h - 12 : y + 16) + 'px';
};
document.addEventListener('mousemove', e => {
  const r = e.target.closest?.('.mb-row');
  if (!r) { tip.classList.remove('on'); return; }
  if (tip.dataset.k !== r.dataset.tip) { tip.innerHTML = r.dataset.tip; tip.dataset.k = r.dataset.tip; }
  tip.classList.add('on'); posTip(e.clientX, e.clientY);
});
document.addEventListener('click', e => {   // celular: toque mostra/esconde
  const r = e.target.closest?.('.mb-row');
  if (!r) { tip.classList.remove('on'); return; }
  tip.innerHTML = r.dataset.tip; tip.dataset.k = r.dataset.tip; tip.classList.add('on');
  const b = r.getBoundingClientRect(); posTip(b.left + 20, b.bottom - 8);
});
document.addEventListener('scroll', () => tip.classList.remove('on'), { passive:true });

/* ═════════════ Início ═════════════ */
$('#f-mes').value = hoje.slice(0, 7);
$('#f-mes').addEventListener('change', carregar);
const mudarMes = n => { const [y, m] = $('#f-mes').value.split('-').map(Number); const dt = new Date(y, m - 1 + n, 1);
  $('#f-mes').value = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`; carregar(); };
$('#mes-ant').onclick = () => mudarMes(-1);
$('#mes-prox').onclick = () => mudarMes(1);
$('#btn-print').onclick = () => {
  document.querySelectorAll('.db-mais').forEach(m => m.open = true);
  // mostra todos os detalhes (gráficos escondidos não têm tamanho) e volta como estava depois de imprimir
  const modal = $('#db-modal'), escondidos = modal ? [modal, ...modal.querySelectorAll('.db-painel')].filter(x => x.hidden) : [];
  document.body.classList.add('db-imprimindo');
  escondidos.forEach(x => { x.hidden = false; });
  requestAnimationFrame(() => { Object.values(charts).forEach(ch => ch?.resize?.()); setTimeout(() => {
    window.print();
    escondidos.forEach(x => { x.hidden = true; });
    document.body.classList.remove('db-imprimindo');
  }, 300); });
};
carregar();
</script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#006636" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SGR Indaiatuba" />
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="img/icons/icon-192.png" />
  <title>Notas Fiscais — SGR Indaiatuba</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div class="page-header">
      <div><h2>Notas Fiscais</h2><p>Acompanhamento do pedido de compra e da nota fiscal, em qualquer ordem</p></div>
      <button class="btn btn-primary" id="btn-novo">+ Novo Registro</button>
    </div>
    <div class="page-body">
      <!-- Filtros -->
      <div class="card mb-16" style="padding:16px">
        <div class="filters-row">
          <div class="form-group"><label>Fornecedor</label><select id="f-fornecedor"><option value="">Todos</option></select></div>
          <div class="form-group"><label>Situação</label><select id="f-status"><option value="">Todas</option></select></div>
          <div class="form-group"><label>Mês de Emissão da NF</label><input type="month" id="f-mes" /></div>
          <div class="form-group"><label>Buscar (Nº Pedido / Nº NF)</label><input type="text" id="f-busca" placeholder="Ex: 1234" /></div>
          <div class="form-group" style="justify-content:flex-end"><label>&nbsp;</label><button class="btn btn-primary" id="btn-filtrar">Filtrar</button></div>
        </div>
      </div>

      <!-- Tabela -->
      <div class="table-card">
        <div class="table-card-header">
          <h3>Registros</h3>
          <span id="pedidos-count" class="text-muted" style="font-size:12px"></span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Nº Pedido</th><th>Fornecedor</th><th>Descrição</th><th class="text-right">Valor</th><th>Nº NF</th><th>Situação</th><th>Atualizado</th><th>Ações</th></tr>
            </thead>
            <tbody id="tb-pedidos"></tbody>
            <tfoot>
              <tr>
                <td colspan="3" class="text-right fw-600">Total</td>
                <td class="text-right fw-600" id="td-total-valor">—</td>
                <td colspan="4"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Novo/Editar Registro -->
<div class="modal-backdrop" id="modal-registro">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h3 id="modal-registro-title">Novo Registro</h3>
      <button class="modal-close" data-close="modal-registro">✕</button>
    </div>
    <div class="modal-body">
      <fieldset id="registro-fieldset" style="border:none;padding:0;margin:0">
        <div class="form-grid mb-16">
          <div class="form-group full">
            <label>Fornecedor *</label>
            <input type="text" id="inp-fornecedor" list="dl-fornecedores" autocomplete="off" placeholder="Digite ou selecione um fornecedor…" />
            <datalist id="dl-fornecedores"></datalist>
          </div>
          <div class="form-group"><label>Nº do Pedido</label><input type="text" id="inp-numero-pedido" placeholder="Se ainda não existir, deixe em branco" /></div>
          <div class="form-group"><label>Nº da Nota Fiscal</label><input type="text" id="inp-numero-nf" placeholder="Se ainda não existir, deixe em branco" /></div>
          <div class="form-group"><label>Data de Emissão da NF</label><input type="date" id="inp-data-emissao" /></div>
          <div class="form-group"><label>Valor (R$)</label><input type="number" id="inp-valor" min="0" step="0.01" /></div>
          <div class="form-group full"><label>Descrição / Itens</label><textarea id="inp-descricao" placeholder="O que está sendo comprado…"></textarea></div>
        </div>

        <label class="mb-8" style="display:block">Etapas (marque as que já aconteceram, em qualquer ordem)</label>
        <div class="nf-checklist" id="nf-checklist"></div>

        <div class="form-grid mt-16">
          <div class="form-group full"><label>Observação</label><textarea id="inp-observacao" placeholder="Ex: nota salva na pasta Financeiro/NFs/2026…"></textarea></div>
        </div>
      </fieldset>
    </div>
    <div class="modal-footer" style="justify-content:space-between">
      <div>
        <button class="btn btn-outline" id="btn-cancelar-registro" style="display:none">Marcar como Cancelado</button>
        <button class="btn btn-outline" id="btn-reabrir" style="display:none">Reabrir Registro</button>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-outline" data-close="modal-registro">Fechar</button>
        <button class="btn btn-primary" id="btn-salvar-registro">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { initPage, supabase, moeda, dataBR, toast, abrirModal, fecharModal } from './js/config.js?v=2';
import { icon } from './js/icons.js';

await initPage();

const STEPS = [
  { id: 'pedido_criado',      label: 'Pedido de Compra Criado', date: 'data_pedido' },
  { id: 'aprovado',           label: 'Aprovado no Sistema',      date: 'data_aprovacao' },
  { id: 'enviado_fornecedor', label: 'Enviado ao Fornecedor',    date: 'data_envio_fornecedor' },
  { id: 'nf_emitida',         label: 'NF Emitida pelo Fornecedor', date: 'data_nf_emitida' },
  { id: 'nf_recebida',        label: 'NF Recebida por Nós',      date: 'data_nf_recebida' },
  { id: 'lancada_sistema',    label: 'Entrada da NF Lançada no Sistema', date: 'data_lancamento' },
  { id: 'arquivada',          label: 'Nota Salva na Pasta',      date: 'data_arquivamento' },
  { id: 'enviada_financeiro', label: 'Enviada ao Financeiro',    date: 'data_envio_financeiro' },
];
const BADGE = {
  pedido_criado: 'gray', aprovado: 'blue', enviado_fornecedor: 'purple',
  nf_emitida: 'yellow', nf_recebida: 'teal', lancada_sistema: 'orange',
  arquivada: 'indigo', enviada_financeiro: 'green', cancelado: 'red', novo: 'gray',
};

let perfil, fornData = [], pedidosData = [], registroAtual = null;

function hojeISO() { return new Date().toISOString().split('T')[0]; }
function soData(v) { return v ? v.split('T')[0] : ''; }

/* Situação exibida = etapa mais avançada já marcada, na ordem do pipeline.
   Funciona mesmo quando as etapas acontecem fora de ordem (ex: NF antes do pedido). */
function situacaoAtual(r) {
  if (r.cancelado) return { label: 'Cancelado', cor: 'red', proxima: null, completo: false };

  let idx = -1;
  for (let i = STEPS.length - 1; i >= 0; i--) {
    if (r[STEPS[i].date]) { idx = i; break; }
  }
  const atual   = idx >= 0 ? STEPS[idx] : null;
  const proxima = STEPS[idx + 1] || null;

  return {
    label: atual ? atual.label : 'Novo',
    cor: atual ? BADGE[atual.id] : 'gray',
    proxima: proxima ? proxima.label : null,
    completo: idx === STEPS.length - 1,
  };
}

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  const { data: p } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  perfil = p;

  const { data: forn } = await supabase.from('fornecedores').select('id, nome').eq('ativo', true).order('nome');
  fornData = forn || [];
  atualizarListasFornecedor();

  document.getElementById('f-status').innerHTML = `
    <option value="">Todas</option>
    <option value="processo">Em Processo</option>
    <option value="concluido">Concluído</option>
  `;

  const isAdmin = perfil?.role === 'admin';
  document.getElementById('btn-novo').style.display = isAdmin ? '' : 'none';

  await carregarPedidos();
}

function atualizarListasFornecedor() {
  document.getElementById('dl-fornecedores').innerHTML = fornData.map(f => `<option value="${f.nome}"></option>`).join('');
  document.getElementById('f-fornecedor').innerHTML = '<option value="">Todos</option>' + fornData.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
}

/* Encontra o fornecedor pelo nome digitado (sem diferenciar maiúsculas/acentos exatos);
   se não existir, cria um novo cadastro automaticamente. */
async function resolverFornecedor(nome) {
  const nomeNorm = nome.trim();
  const existente = fornData.find(f => f.nome.trim().toLowerCase() === nomeNorm.toLowerCase());
  if (existente) return existente.id;

  const { data, error } = await supabase.from('fornecedores').insert({ nome: nomeNorm }).select('id, nome').single();
  if (error) { toast('Erro ao criar fornecedor: ' + error.message, 'error'); throw error; }
  fornData.push(data);
  atualizarListasFornecedor();
  return data.id;
}

async function carregarPedidos() {
  let q = supabase.from('notas_fiscais_pedidos').select('*, fornecedores(nome)').order('atualizado_em', { ascending: false });

  const forn   = document.getElementById('f-fornecedor').value;
  const status = document.getElementById('f-status').value;
  const busca  = document.getElementById('f-busca').value.trim();
  const mes    = document.getElementById('f-mes').value;

  if (forn)   q = q.eq('fornecedor_id', forn);
  if (busca)  q = q.or(`numero_pedido.ilike.%${busca}%,numero_nf.ilike.%${busca}%`);
  if (mes) {
    const [ano, mesNum] = mes.split('-').map(Number);
    const proximoMes = mesNum === 12 ? `${ano + 1}-01-01` : `${ano}-${String(mesNum + 1).padStart(2, '0')}-01`;
    q = q.gte('data_nf_emitida', `${mes}-01`).lt('data_nf_emitida', proximoMes);
  }

  const { data } = await q;
  let rows = data || [];
  if (status === 'processo')       rows = rows.filter(r => !situacaoAtual(r).completo);
  else if (status === 'concluido') rows = rows.filter(r => situacaoAtual(r).completo);

  pedidosData = rows;
  renderTabela();
}

function renderTabela() {
  const isAdmin = perfil?.role === 'admin';
  document.getElementById('pedidos-count').textContent = `${pedidosData.length} registros`;
  const tb = document.getElementById('tb-pedidos');

  const totalValor = pedidosData.reduce((s, r) => s + (r.valor != null ? Number(r.valor) : 0), 0);
  document.getElementById('td-total-valor').textContent = moeda(totalValor);

  if (!pedidosData.length) {
    tb.innerHTML = '<tr><td colspan="8" class="table-empty">Nenhum registro encontrado</td></tr>';
    return;
  }

  tb.innerHTML = pedidosData.map(r => {
    const sit = situacaoAtual(r);
    return `
      <tr>
        <td class="fw-600">
          <span class="nf-dot ${sit.completo ? 'nf-dot-green' : 'nf-dot-red'}" title="${sit.completo ? 'Concluído' : 'Pendente'}"></span>
          ${r.numero_pedido || '—'}
        </td>
        <td>${r.fornecedores?.nome || '—'}</td>
        <td>${r.descricao || '—'}</td>
        <td class="text-right">${r.valor != null ? moeda(r.valor) : '—'}</td>
        <td>${r.numero_nf || '—'}${r.data_nf_emitida ? ` <span class="text-muted" style="font-size:11px">(${dataBR(soData(r.data_nf_emitida))})</span>` : ''}</td>
        <td>
          <span class="badge badge-${sit.cor}">${sit.label}</span>
          ${sit.proxima
            ? `<div class="text-muted" style="font-size:11px;margin-top:3px;white-space:nowrap">Pendente: ${sit.proxima}</div>`
            : (!r.cancelado ? '<div class="text-green" style="font-size:11px;margin-top:3px">Concluído</div>' : '')}
        </td>
        <td>${dataBR(soData(r.atualizado_em || r.criado_em))}</td>
        <td>
          <button class="btn-icon" onclick="abrirRegistro('${r.id}')">${isAdmin ? icon('edit',{size:15}) : icon('eye',{size:15})}</button>
          ${isAdmin ? `<button class="btn-icon danger" onclick="excluirPedido('${r.id}')">${icon('trash',{size:15})}</button>` : ''}
        </td>
      </tr>`;
  }).join('');
}

function buildChecklist(record) {
  const el = document.getElementById('nf-checklist');
  el.innerHTML = STEPS.filter(s => s.date !== 'data_nf_emitida').map(s => {
    const val = record ? record[s.date] : null;
    return `
      <div class="nf-check-row">
        <label class="nf-check-label">
          <input type="checkbox" class="nf-check-cb" data-step="${s.date}" ${val ? 'checked' : ''} />
          ${s.label}
        </label>
        <input type="date" class="nf-check-date" data-step-input="${s.date}" value="${val || ''}" ${val ? '' : 'disabled'} />
      </div>`;
  }).join('');

  el.querySelectorAll('.nf-check-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      const dateInput = el.querySelector(`[data-step-input="${cb.dataset.step}"]`);
      if (cb.checked) {
        dateInput.disabled = false;
        if (!dateInput.value) dateInput.value = hojeISO();
      } else {
        dateInput.disabled = true;
        dateInput.value = '';
      }
    });
  });
}

function coletarChecklist() {
  const el = document.getElementById('nf-checklist');
  const out = { data_nf_emitida: document.getElementById('inp-data-emissao').value || null };
  STEPS.forEach(s => {
    if (s.date === 'data_nf_emitida') return;
    const cb = el.querySelector(`[data-step="${s.date}"]`);
    const dateInput = el.querySelector(`[data-step-input="${s.date}"]`);
    out[s.date] = cb.checked ? (dateInput.value || hojeISO()) : null;
  });
  return out;
}

window.abrirRegistro = id => {
  const r = pedidosData.find(p => p.id === id);
  if (!r) return;
  abrirModalRegistro(r);
};

function abrirModalRegistro(record) {
  registroAtual = record || null;
  const isAdmin = perfil?.role === 'admin';

  document.getElementById('modal-registro-title').textContent = record
    ? `Registro — ${record.numero_pedido || record.numero_nf || record.fornecedores?.nome || ''}`
    : 'Novo Registro';

  document.getElementById('inp-fornecedor').value    = record?.fornecedores?.nome || '';
  document.getElementById('inp-numero-pedido').value = record?.numero_pedido || '';
  document.getElementById('inp-numero-nf').value      = record?.numero_nf || '';
  document.getElementById('inp-data-emissao').value   = soData(record?.data_nf_emitida);
  document.getElementById('inp-valor').value          = record?.valor ?? '';
  document.getElementById('inp-descricao').value      = record?.descricao || '';
  document.getElementById('inp-observacao').value     = record?.observacao || '';

  buildChecklist(record);

  document.getElementById('registro-fieldset').disabled = !isAdmin;
  document.getElementById('btn-salvar-registro').style.display = isAdmin ? '' : 'none';
  document.getElementById('btn-cancelar-registro').style.display = (isAdmin && record && !record.cancelado) ? '' : 'none';
  document.getElementById('btn-reabrir').style.display = (isAdmin && record?.cancelado) ? '' : 'none';

  abrirModal('modal-registro');
}

document.getElementById('btn-novo').addEventListener('click', () => abrirModalRegistro(null));

document.getElementById('btn-salvar-registro').addEventListener('click', async () => {
  const nomeForn = document.getElementById('inp-fornecedor').value.trim();
  if (!nomeForn) { toast('Informe o fornecedor', 'error'); return; }

  let fornecedor_id;
  try { fornecedor_id = await resolverFornecedor(nomeForn); }
  catch { return; }

  const payload = {
    fornecedor_id,
    numero_pedido: document.getElementById('inp-numero-pedido').value.trim() || null,
    numero_nf:     document.getElementById('inp-numero-nf').value.trim() || null,
    valor:         document.getElementById('inp-valor').value ? parseFloat(document.getElementById('inp-valor').value) : null,
    descricao:     document.getElementById('inp-descricao').value.trim() || null,
    observacao:    document.getElementById('inp-observacao').value.trim() || null,
    ...coletarChecklist(),
    atualizado_em: new Date().toISOString(),
  };

  if (registroAtual) {
    const { error } = await supabase.from('notas_fiscais_pedidos').update(payload).eq('id', registroAtual.id);
    if (error) { toast('Erro ao salvar: ' + error.message, 'error'); return; }
    toast('Registro atualizado!');
  } else {
    const { data: { user } } = await supabase.auth.getUser();
    payload.criado_por = user.id;
    const { error } = await supabase.from('notas_fiscais_pedidos').insert(payload);
    if (error) { toast('Erro ao criar: ' + error.message, 'error'); return; }
    toast('Registro criado!');
  }
  fecharModal('modal-registro');
  await carregarPedidos();
});

document.getElementById('btn-cancelar-registro').addEventListener('click', async () => {
  if (!confirm('Marcar este registro como cancelado?')) return;
  const { error } = await supabase.from('notas_fiscais_pedidos').update({ cancelado: true, atualizado_em: new Date().toISOString() }).eq('id', registroAtual.id);
  if (error) { toast('Erro: ' + error.message, 'error'); return; }
  toast('Registro cancelado.', 'info');
  fecharModal('modal-registro');
  await carregarPedidos();
});

document.getElementById('btn-reabrir').addEventListener('click', async () => {
  const { error } = await supabase.from('notas_fiscais_pedidos').update({ cancelado: false, atualizado_em: new Date().toISOString() }).eq('id', registroAtual.id);
  if (error) { toast('Erro: ' + error.message, 'error'); return; }
  toast('Registro reaberto.');
  fecharModal('modal-registro');
  await carregarPedidos();
});

window.excluirPedido = async id => {
  if (!confirm('Excluir este registro?')) return;
  const { error } = await supabase.from('notas_fiscais_pedidos').delete().eq('id', id);
  if (error) { toast('Erro ao excluir: ' + error.message, 'error'); return; }
  toast('Registro excluído!');
  await carregarPedidos();
};

document.getElementById('btn-filtrar').addEventListener('click', carregarPedidos);
document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => fecharModal(btn.dataset.close)));
document.querySelectorAll('.modal-backdrop').forEach(m => m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); }));

await init();
</script>
</body>
</html>
